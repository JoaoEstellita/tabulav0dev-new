<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estúdio · Tábula Estelar</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0A14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0A14'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23FFD93D'/%3E%3Ccircle cx='21' cy='12' r='10' fill='%230B0A14'/%3E%3C/svg%3E">

<style>
  :root {
    color-scheme: dark;
    --noite: #0B0A14;
    --superficie: #15131F;
    --elevado: #1E1B2B;
    --borda: #2A2637;
    --tinta: #F2EFF7;
    --tinta-2: #A8A2B8;
    --ouro: #FFD93D;
    --zap: #25D366;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace;
  }
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body {
    background: var(--noite); color: var(--tinta);
    font-family: var(--sans); font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: 26px 18px 60px;
    padding-bottom: max(60px, env(safe-area-inset-bottom));
  }
  .env { max-width: 660px; margin-inline: auto; }

  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
  .sub { color: var(--tinta-2); font-size: 15.5px; margin-top: 5px; }

  /* ── porta ── */
  #porta { max-width: 380px; margin: 14vh auto 0; }
  #porta p { color: var(--tinta-2); font-size: 15.5px; margin: 8px 0 20px; }
  input[type=password] {
    width: 100%; min-height: 54px;
    background: var(--superficie); color: var(--tinta);
    border: 1.5px solid var(--borda); border-radius: 12px;
    padding: 0 16px; font-size: 17px; font-family: var(--sans);
  }
  input[type=password]:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }

  button {
    font-family: var(--sans); font-size: 16px; font-weight: 700;
    min-height: 54px; padding: 0 22px;
    border: none; border-radius: 12px; cursor: pointer;
    background: var(--ouro); color: #241E00;
    transition: filter .2s;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--tinta); outline-offset: 3px; }
  button[disabled] { opacity: .55; cursor: default; }
  #porta button { width: 100%; margin-top: 12px; }

  .erro { color: #FF8080; font-size: 15px; margin-top: 12px; }

  /* ── lista ── */
  .cab {
    display: flex; align-items: flex-start; gap: 14px;
    padding-bottom: 18px; border-bottom: 1px solid var(--borda);
    margin-bottom: 26px;
  }
  .cab .sair {
    margin-left: auto; background: transparent; color: var(--tinta-2);
    border: 1px solid var(--borda); min-height: 40px; font-size: 14px; font-weight: 600;
  }

  .dia { margin-bottom: 52px; }
  /* nada de text-transform: capitalize aqui — era o que produzia "6 De Agosto" */
  .dia h2 { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; }
  .dia .iso {
    font-family: var(--mono); font-size: 13px; color: var(--tinta-2);
    font-variant-numeric: tabular-nums;
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }

  /* apagar não tem volta: fica discreto, longe do polegar que vem baixar */
  .apagar {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    background: none; border: 1px solid var(--tinta-2); border-radius: 6px;
    color: var(--tinta-2); padding: 3px 8px; cursor: pointer; opacity: 0.55;
  }
  .apagar:hover { opacity: 1; border-color: #E0623C; color: #E0623C; }
  .apagar:disabled { cursor: default; opacity: 0.4; }

  .pecas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  /* a carta e o vídeo têm muito detalhe: ocupam a linha inteira */
  .pecas .larga { grid-column: 1 / -1; }
  @media (max-width: 560px) { .pecas { grid-template-columns: 1fr; gap: 20px; } }

  figure { display: flex; flex-direction: column; gap: 9px; }
  img, video {
    width: 100%; height: auto; display: block;
    border: 1px solid var(--borda); border-radius: 10px;
    background: var(--superficie);
  }
  video { max-height: 78vh; }
  figcaption {
    font-family: var(--mono); font-size: 12.5px; color: var(--tinta-2);
    letter-spacing: .06em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  /* "segure a imagem" não existe no computador: cada peça precisa de um botão */
  .baixar {
    margin-left: auto;
    min-height: 38px; padding: 0 14px;
    font-size: 13px; font-weight: 700; letter-spacing: .04em;
    background: transparent; color: var(--ouro);
    border: 1px solid var(--ouro); border-radius: 8px;
    text-transform: none;
  }
  .baixar:hover { background: var(--ouro); color: #241E00; }
  .baixar[disabled] { opacity: .6; }

  #editorial { margin-bottom: 32px; }
  #editorial > summary {
    list-style: none; cursor: pointer;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ouro);
    padding: 14px 16px; min-height: 44px;
    background: var(--superficie); border: 1px solid var(--borda);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #editorial > summary::-webkit-details-marker { display: none; }
  #editorial > summary::after { content: "▾"; color: var(--tinta-2); }
  #editorial[open] > summary::after { content: "▴"; }

  .pautas { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .dica {
    font-size: 12px; line-height: 1.45; color: var(--tinta-2);
    margin-top: 10px;
  }
  .dia-pauta {
    background: var(--superficie); border: 1px solid var(--borda);
    border-radius: 12px; padding: 12px 14px;
  }
  .dia-pauta > .quando {
    font-family: var(--mono); font-size: 13px; color: var(--ouro);
    font-variant-numeric: tabular-nums; display: block; margin-bottom: 8px;
  }
  /* quantos assuntos o dia comportar: caixa, não rádio — cada um vira uma peça */
  .assunto {
    display: block; cursor: pointer; padding: 9px 10px; border-radius: 9px;
    border: 1px solid transparent; margin-bottom: 2px;
  }
  .assunto:hover { background: var(--elevado); }
  .assunto.on { border-color: var(--ouro); background: rgba(255,217,61,0.07); }
  .assunto input { position: absolute; opacity: 0; pointer-events: none; }
  .assunto .t { font-size: 14px; line-height: 1.35; display: block; }
  .assunto.on .t { color: var(--ouro); }
  .assunto .a { font-size: 12px; color: var(--tinta-2); line-height: 1.4; display: block; margin-top: 2px; }

  /**
   * Acontece no dia, ou explica uma posição que já vale?
   *
   * O João viu "Vênus em Libra", "Marte em Câncer" e "Júpiter em Leão" no mesmo
   * dia, todos com o mesmo subtítulo, e perguntou se o planeta entrava no signo
   * ou se era post explicativo. Eram os três explicativos, e a tela não dizia.
   */
  .selo {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 2px 6px; border-radius: 5px;
    margin-left: 8px; vertical-align: 1px; white-space: nowrap;
  }
  .selo.evento { background: rgba(255,209,102,0.16); color: var(--ouro); }
  .selo.explicativo,
  .selo.educativo { background: rgba(255,255,255,0.07); color: var(--tinta-2); }
  .selo.produto { background: rgba(96,165,250,0.16); color: #93C5FD; }

  /**
   * O BANCO: o que não tem dia.
   *
   * A agenda repetia "Marte em Câncer" 21 vezes em 21 dias, porque a posição
   * vale seis semanas e a tela era uma agenda. O que não tem data vive aqui,
   * numa fila que ele ordena uma vez e alimenta os dias sem evento — que são a
   * maioria: sete de trinta têm evento datado.
   */
  .titulo-secao {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ouro);
    margin: 26px 0 4px; font-weight: 600;
  }
  .barra-salvar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 1px solid var(--borda);
  }
  .barra-salvar .copiar { margin: 0; }

  .banco { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
  .item-banco {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 9px;
    border: 1px solid transparent; background: var(--superficie);
  }
  .item-banco.on { border-color: var(--ouro); background: rgba(255,217,61,0.07); }
  .item-banco .pega { flex: 1; cursor: pointer; min-width: 0; }
  .item-banco input { position: absolute; opacity: 0; pointer-events: none; }
  .item-banco .t { font-size: 14px; line-height: 1.3; display: block; }
  .item-banco.on .t { color: var(--ouro); }
  .item-banco .a { font-size: 11.5px; color: var(--tinta-2); display: block; margin-top: 1px; }

  /* setas em vez de arrastar: no celular, arrastar disputa com a rolagem */
  .setas { display: flex; flex-direction: column; gap: 2px; flex: 0 0 auto; }
  .seta {
    min-height: 22px; padding: 0 9px; font-size: 12px; line-height: 1;
    background: transparent; color: var(--tinta-2);
    border: 1px solid var(--borda); border-radius: 6px;
  }
  .seta:hover { color: var(--ouro); border-color: var(--ouro); }

  .por-dia {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-top: 10px; font-size: 12px; color: var(--tinta-2);
  }
  .qtd {
    min-width: 30px; text-align: center; cursor: pointer;
    padding: 4px 8px; border-radius: 7px;
    border: 1px solid var(--borda); background: var(--superficie);
    font-family: var(--mono); font-size: 12px;
  }
  .qtd input { position: absolute; opacity: 0; pointer-events: none; }
  .qtd.on { border-color: var(--ouro); color: var(--ouro); background: rgba(255,217,61,0.1); }
  .dura { margin-left: 6px; font-style: italic; opacity: 0.85; }

  /**
   * O mesmo assunto marcado em dois dias.
   *
   * Medido: o eclipse de 12/08 marcado em 09, 10, 11 e 12 sai com dado, título
   * e corpo IDÊNTICOS — só o prefixo "Faltam 3 dias" muda, e 9 das 12 linhas da
   * legenda se repetem. É a mesma peça quatro vezes. Não bloqueio (véspera e
   * dia podem ser deliberados), mas não deixo passar em silêncio.
   */
  .repetido {
    display: none; margin-top: 6px;
    font-family: var(--mono); font-size: 11px; line-height: 1.4;
    color: #F0A93B;
  }
  .assunto.on .repetido { display: block; }

  /* os formatos só aparecem no assunto escolhido */
  .formatos { display: none; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .assunto.on .formatos { display: flex; }
  /* alvo de toque grande: isto é usado no celular, com o polegar */
  .formato {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 12px; color: var(--tinta-2);
    background: var(--elevado); border: 1px solid var(--borda);
    border-radius: 999px; padding: 7px 12px; cursor: pointer;
    min-height: 38px;
  }
  .formato.on { color: var(--noite); background: var(--ouro); border-color: var(--ouro); }
  .formato input { accent-color: var(--noite); width: 15px; height: 15px; }

  /**
   * A editorial vive numa coluna lateral a partir de 1000px.
   *
   * Ela nasceu no topo e empurrava os cards recém-criados para baixo — que são
   * justamente o que se abre o Estúdio para ver. Abaixo de 1000px vira um
   * `details` recolhido de uma linha, então no celular a primeira coisa na tela
   * continua sendo o card do dia.
   */
  @media (min-width: 1000px) {
    .env { max-width: 1040px; }
    /* `:not(.oculto)` é obrigatório: seletor de ID (1,0,0) vence `.oculto`
       (0,1,0) por especificidade, não por ordem. Sem isto o painel aparecia
       ATRÁS da tela de senha em qualquer monitor de 1000px para cima — vazio,
       porque o fetch nem sai sem a senha, mas dando a impressão de que a
       senha não separa nada. */
    #painel:not(.oculto) {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 40px;
      align-items: start;
    }
    /* cabeçalho e lista ocupam a coluna da esquerda */
    #painel > header, #painel > #lista { grid-column: 1; }
    #editorial {
      grid-column: 2; grid-row: 1 / span 2;
      position: sticky; top: 20px;
      max-height: calc(100vh - 40px); overflow-y: auto;
      margin: 0; padding-left: 20px;
      border-left: 1px solid var(--borda);
    }
    /* aberta por padrão no desktop, onde não disputa espaço com nada */
    #editorial > summary { display: none; }
    #editorial[open] > .conteudo-editorial, #editorial > .conteudo-editorial { display: block; }
  }


  /* separa o carrossel e a enquete das peças soltas do dia */
  .secao {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--tinta-2);
    margin: 26px 0 10px; font-weight: 400;
  }
  pre {
    font-family: var(--mono); font-size: 15px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
    background: var(--superficie); border: 1px solid var(--borda);
    border-radius: 12px; padding: 16px; margin-top: 12px; color: #D2CDE0;
  }
  .copiar {
    width: 100%; margin-top: 12px;
    background: transparent; color: var(--zap);
    border: 1.5px solid var(--zap);
  }
  .copiar.feito { background: var(--zap); color: #05210F; }

  .aviso {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  .vazio { color: var(--tinta-2); text-align: center; margin-top: 50px; font-size: 15.5px; }
  .vazio code { color: var(--ouro); font-family: var(--mono); font-size: 13.5px; }

  .oculto { display: none; }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>

<section id="porta" class="env">
  <h1>Estúdio</h1>
  <p>Os cards do dia, prontos para publicar.</p>
  <!--
    Formulário de verdade, com submit, porque é isso que faz o navegador
    oferecer para guardar a senha — `autocomplete` sozinho num input solto não
    dispara nada. O campo de usuário é oculto e fixo: o gerenciador precisa de
    um par para salvar, e aqui só existe uma conta.
  -->
  <form id="form-login" autocomplete="on">
    <input type="text" name="usuario" value="estudio" autocomplete="username"
           readonly hidden aria-hidden="true" tabindex="-1">
    <input type="password" id="senha" name="senha" placeholder="Senha"
           autocomplete="current-password" enterkeyhint="go">
    <button type="submit" id="entrar">Entrar</button>
  </form>
  <p class="erro oculto" id="erro-login" role="alert"></p>
</section>

<main id="painel" class="env oculto">
  <div class="cab">
    <div>
      <h1>Estúdio</h1>
      <p class="sub">Toque em Baixar em cada peça. A legenda fica abaixo, pronta para copiar.</p>
    </div>
    <button type="button" class="sair" id="sair">Sair</button>
  </div>
  <details id="editorial"></details>
  <div id="lista"></div>
</main>

<span class="aviso" role="status" aria-live="polite" id="aviso"></span>

<script>
(function () {
  var BACKEND = 'https://tabulav0dev-backend.vercel.app'
  var CHAVE = 'tabula_estudio_senha'

  var porta = document.getElementById('porta')
  var painel = document.getElementById('painel')
  var lista = document.getElementById('lista')
  // guardada para o POST da pauta: o GET já autenticou, e pedir de novo seria
  // atrito no meio da tarefa
  var ultimaSenha = ''
  var aviso = document.getElementById('aviso')
  var erroLogin = document.getElementById('erro-login')

  // Intl em vez de tabela própria: acerta as preposições do português sozinho
  // ("6 de agosto", não "6 De Agosto") e não exige manutenção
  var FORMATO = new Intl.DateTimeFormat('pt-BR', {
    weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'
  })

  function rotular(iso) {
    var p = iso.split('-')
    var txt = FORMATO.format(new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])))
    var hoje = new Date().toISOString().slice(0, 10)
    return (iso === hoje ? 'Hoje · ' : '') + txt.charAt(0).toUpperCase() + txt.slice(1)
  }

  function escapar(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  /**
   * Baixa uma peça de fato.
   *
   * O atributo `download` do <a> é ignorado quando o arquivo vem de outro
   * domínio, e as URLs assinadas vêm do Storage. Por isso o caminho é buscar o
   * conteúdo e criar um blob local. Se o CORS do bucket recusar, abre em nova
   * aba, que ao menos deixa salvar à mão.
   */
  function baixar(botao, url, nome) {
    var rotulo = botao.textContent
    botao.disabled = true
    botao.textContent = 'Baixando…'

    fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status)
      return r.blob()
    }).then(function (blob) {
      var alvo = URL.createObjectURL(blob)
      var a = document.createElement('a')
      a.href = alvo
      a.download = nome
      document.body.appendChild(a)
      a.click()
      document.body.removeChild(a)
      setTimeout(function () { URL.revokeObjectURL(alvo) }, 4000)
      botao.textContent = 'Baixado'
      aviso.textContent = nome + ' baixado.'
    }).catch(function () {
      window.open(url, '_blank', 'noopener')
      botao.textContent = 'Abriu em nova aba'
      aviso.textContent = 'Não deu para baixar direto. Abri em nova aba para salvar à mão.'
    }).finally(function () {
      setTimeout(function () {
        botao.disabled = false
        botao.textContent = rotulo
        aviso.textContent = ''
      }, 2600)
    })
  }

  // Clipboard API exige contexto seguro; o textarea funciona em qualquer um
  function copiar(texto) {
    var area = document.createElement('textarea')
    area.value = texto
    area.setAttribute('readonly', '')
    area.style.position = 'fixed'
    area.style.top = '-1000px'
    document.body.appendChild(area)
    area.select()
    area.setSelectionRange(0, texto.length)
    var ok = false
    try { ok = document.execCommand('copy') } catch (e) { ok = false }
    document.body.removeChild(area)
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(texto).catch(function () {})
      return true
    }
    return ok
  }

  /**
   * A editorial: as pautas calculadas dos próximos dias, para marcar o que sai.
   *
   * Antes o robô escolhia sozinho e o que saía era o que saía — sem critério
   * editorial nenhum. Aqui o cálculo continua sendo do robô (as datas e os
   * eventos são efeméride, não opinião), mas quem decide o que vira post é o
   * João, e o Actions passa a obedecer.
   */
  /**
   * A editorial: os assuntos que cada dia comporta, para escolher qual vira post.
   *
   * A primeira versao listava o mesmo evento repetido por angulo de publicacao —
   * "Mercurio entra em Leao" na vespera e no dia, "Eclipse solar" quatro vezes —
   * e o Joao disse o que era: aquilo nao sao opcoes. Agora cada dia traz de
   * quatro a sete ASSUNTOS distintos, e um deles vira a peca.
   */
  function desenharEditorial(dias) {
    var editorial = document.getElementById('editorial')

    // Exige o formato NOVO, agrupado por dia. Um `calendario.json` gravado antes
    // da reestruturação é uma lista plana sem `opcoes`, e `d.opcoes.map`
    // estourava — dentro de um `.then`, virando rejeição silenciosa que levava a
    // página inteira junto. Formato desconhecido é tratado como ausente.
    var comCal = dias.filter(function (d) {
      return d.calendario && d.calendario.length && d.calendario[0] &&
        Array.isArray(d.calendario[0].opcoes)
    })
    if (!comCal.length) {
      editorial.innerHTML =
        '<summary>Editorial</summary>' +
        '<p class="vazio">As pautas dos proximos dias chegam junto com o card, ' +
        'todo dia as 6h.<br><br>' +
        'Para preencher agora: <b>Actions &rarr; Card diario &rarr; Run workflow</b>, ' +
        'marcando <b>so o calendario</b>.</p>'
      return
    }

    var agenda = comCal[0].calendario
    var escolhas = {}
    dias.forEach(function (d) {
      if (!d.pauta) return
      // formato novo: lista de assuntos, cada um com seus formatos
      if (Array.isArray(d.pauta.opcoes) && d.pauta.opcoes.length) {
        var porId = {}
        d.pauta.opcoes.forEach(function (o) { porId[o.id] = o.formatos || [] })
        escolhas[d.dia] = {
          ids: d.pauta.opcoes.map(function (o) { return o.id }),
          formatosPorId: porId,
        }
      } else if (d.pauta.opcaoId) {
        escolhas[d.dia] = { id: d.pauta.opcaoId, formatos: d.pauta.formatos || [] }
      }
    })

    /**
     * O BANCO e a FILA.
     *
     * A agenda passou a ter só o que acontece no dia. O resto — planeta em
     * signo, retrogradação, conceitos, recursos do app e a lua fora de curso —
     * não tem dia certo e vive aqui, numa fila que o João ordena uma vez.
     *
     * Medido antes da separação: 96 linhas na agenda para 27 assuntos, com
     * "Marte em Câncer" repetido 21 vezes em 21 dias.
     */
    var banco = []
    var fila = []
    var porDia = 1
    dias.forEach(function (d) {
      if (!banco.length && Array.isArray(d.banco) && d.banco.length) banco = d.banco
      if (fila.length || !d.fila) return
      // dois formatos: array puro (a primeira versão) e {itens, porDia}
      if (Array.isArray(d.fila)) { fila = d.fila }
      else if (Array.isArray(d.fila.itens)) { fila = d.fila.itens; porDia = d.fila.porDia || 1 }
    })

    var hoje = new Date().toISOString().slice(0, 10)
    var futuros = agenda.filter(function (x) { return x.dia >= hoje })
    if (!futuros.length) futuros = agenda.slice(0, 10)
    futuros = futuros.slice(0, 14)

    /**
     * O assunto sugerido de cada dia, sem repetir o do dia anterior.
     *
     * Marcar simplesmente o de maior peso sugeria o MESMO eclipse em quatro
     * dias seguidos — medido: dez avisos de repetição de uma vez. O peso manda,
     * mas entre dois dias vizinhos ele aponta para o mesmo evento, e o que sai
     * disso é a mesma peça várias vezes.
     *
     * Então a sugestão é o assunto de maior peso que ainda não foi sugerido.
     * Continua sendo só sugestão: marcar o repetido é um toque, para quando a
     * véspera e o dia forem escolha deliberada.
     */
    var jaSugeridos = {}
    futuros.forEach(function (d) {
      var inedito = d.opcoes.filter(function (o) { return !jaSugeridos[o.id] })[0]
      var alvo = inedito || d.opcoes[0]
      if (alvo) {
        d.__sugerido = alvo.id
        jaSugeridos[alvo.id] = true
      }
    })

    var corpo = futuros.map(function (d) {
      var escolha = escolhas[d.dia] || {}
      var linhas = d.opcoes.map(function (o, i) {
        /**
         * Sem pauta salva, o primeiro já vem marcado.
         *
         * A lista sai em ordem de peso — `eventos.sort((a, b) => b.peso - a.peso)`
         * lá no cálculo —, mas nada dizia isso, e o João perguntou se tinha de
         * escolher "de cima pra baixo". Tinha, e o topo já era a resposta certa
         * na maioria dos dias. Agora ele vem marcado e desmarcar é um toque.
         */
        /**
         * VÁRIOS ASSUNTOS POR DIA.
         *
         * Era radio: marcar um desmarcava o outro, e saía uma peça por dia. O
         * João pediu escolher quantos quiser, "podendo ser mais de um e mais de
         * um carrossel ou post mesmo".
         *
         * `escolha.ids` é o formato novo, uma lista. `escolha.id` é a pauta
         * antiga, de quando havia um só: continua sendo lida para as pautas já
         * salvas não sumirem da tela.
         */
        var marcados = escolha.ids || (escolha.id ? [escolha.id] : null)
        var on = marcados ? marcados.indexOf(o.id) >= 0 : d.__sugerido === o.id
        var formatos = o.formatos.map(function (f) {
          // Sem escolha previa, TUDO que o assunto comporta vem marcado, e
          // desmarcar e um toque. Marcar um a um era o atrito: escolher o
          // assunto ja e a decisao, e o normal e querer as pecas todas.
          // `escolha.formatos` só existe quando veio pauta salva. Marcar o
          // primeiro assunto por padrão passou a acionar este ramo sem escolha
          // nenhuma no objeto, e o `.indexOf` de undefined derrubava a editorial.
          // por assunto, e não mais um mapa único do dia: cada peça tem os
          // seus formatos
          var doAssunto = (escolha.formatosPorId || {})[o.id] || (on ? escolha.formatos : null)
          var fon = doAssunto ? doAssunto.indexOf(f) >= 0 : true
          return '<label class="formato' + (fon ? ' on' : '') + '">' +
            '<input type="checkbox" data-dia="' + d.dia + '" data-formato="' + f + '"' +
            (fon ? ' checked' : '') + '> ' + f + '</label>'
        }).join('')
        // o selo diz de cara se aquilo ACONTECE no dia ou se e explicacao de
        // uma posicao que ja vale: era a informacao que faltava para escolher
        var natureza = o.natureza || 'explicativo'
        return '<label class="assunto' + (on ? ' on' : '') + '">' +
          '<input type="checkbox" data-assunto="1" data-dia="' + d.dia +
            '" value="' + escapar(o.id) + '"' + (on ? ' checked' : '') + '>' +
          '<span class="t">' + escapar(o.titulo) +
            '<span class="selo ' + natureza + '">' + natureza + '</span></span>' +
          '<span class="a">' + escapar(o.angulo) + '</span>' +
          '<span class="repetido" data-id="' + escapar(o.id) + '"></span>' +
          '<span class="formatos">' + formatos + '</span>' +
        '</label>'
      }).join('')

      return '<div class="dia-pauta">' +
        '<span class="quando">' + d.dia.slice(8) + '/' + d.dia.slice(5, 7) + '</span>' +
        linhas +
      '</div>'
    }).join('')

    var total = futuros.reduce(function (n, d) { return n + d.opcoes.length }, 0)

    /**
     * A FILA DO BANCO.
     *
     * Ordenada: o que está em cima sai primeiro, nos dias que não têm evento no
     * céu. São a maioria — medido em trinta dias, só sete têm evento datado.
     *
     * A ordem salva vem de `fila.json`; o que não está nela aparece embaixo,
     * desmarcado, para entrar quando ele quiser.
     */
    var naFila = {}
    fila.forEach(function (id, n) { naFila[id] = n })

    var ordenado = banco.slice().sort(function (a, b) {
      var pa = naFila[a.id], pb = naFila[b.id]
      if (pa === undefined && pb === undefined) return 0
      if (pa === undefined) return 1
      if (pb === undefined) return -1
      return pa - pb
    })

    var linhasBanco = ordenado.map(function (b) {
      var on = naFila[b.id] !== undefined
      var nat = b.natureza || 'educativo'
      return '<div class="item-banco' + (on ? ' on' : '') + '" data-id="' + escapar(b.id) + '">' +
        '<label class="pega">' +
          '<input type="checkbox" data-banco="1" value="' + escapar(b.id) + '"' +
            (on ? ' checked' : '') + '>' +
          '<span class="t">' + escapar(b.titulo) +
            '<span class="selo ' + nat + '">' + nat + '</span></span>' +
          '<span class="a">' + escapar(b.angulo || '') + '</span>' +
        '</label>' +
        '<span class="setas">' +
          '<button type="button" class="seta" data-sobe="1" title="subir">↑</button>' +
          '<button type="button" class="seta" data-desce="1" title="descer">↓</button>' +
        '</span>' +
      '</div>'
    }).join('')

    editorial.innerHTML =
      '<summary>Editorial <span>' + total + ' eventos · ' + banco.length + ' no banco</span></summary>' +
      '<div class="conteudo-editorial">' +
        // o botão no alto: ele pedia rolar 21 dias para chegar nele
        '<div class="barra-salvar">' +
          '<button type="button" id="salvar-pauta" class="copiar">Salvar pauta</button>' +
          '<span id="aviso-pauta" class="aviso"></span>' +
        '</div>' +
        '<h4 class="titulo-secao">Agenda · o que acontece no dia</h4>' +
        '<p class="dica">Só eventos com data. O primeiro de cada dia já vem marcado.</p>' +
        '<div class="pautas">' + corpo + '</div>' +
        '<h4 class="titulo-secao">Banco · sem data, sai na ordem da fila</h4>' +
        '<p class="dica">Marque o que quer publicar e ordene com as setas. ' +
          'Os dias sem evento puxam da fila, de cima para baixo.</p>' +
        /**
         * Quantas peças por dia, e quanto tempo a fila dura com essa escolha.
         *
         * A conta aparece porque a decisão não é óbvia: com 38 itens e uns 23
         * dias de fila por mês, uma por dia dá quase dois meses até repetir, e
         * três por dia dá menos de três semanas.
         */
        '<div class="por-dia">' +
          '<span>Peças por dia, nos dias sem evento:</span>' +
          [1, 2, 3, 4, 5].map(function (n) {
            return '<label class="qtd' + (n === porDia ? ' on' : '') + '">' +
              '<input type="radio" name="por-dia" value="' + n + '"' +
              (n === porDia ? ' checked' : '') + '>' + n + '</label>'
          }).join('') +
          '<span class="dura" id="dura-fila"></span>' +
        '</div>' +
        '<div class="banco">' + linhasBanco + '</div>' +
      '</div>'

    // Quantos assuntos o dia comportar: cada um acende os proprios formatos.
    // Aberta no desktop, recolhida no celular. O `open` e explicito porque o
    // `details` esconde o conteudo por regra do proprio navegador, e CSS sozinho
    // nao vence isso de forma confiavel.
    editorial.open = window.matchMedia('(min-width: 1000px)').matches

    editorial.querySelectorAll('.assunto input[data-assunto]').forEach(function (r) {
      r.addEventListener('change', function () {
        // so a propria caixa acende: com checkbox, o irmao nao muda de estado
        r.closest('.assunto').classList.toggle('on', r.checked)
        /**
     * As setas movem o item na fila.
     *
     * Reordenar por arrastar seria mais elegante e é onde o toque no celular
     * falha: a lista é longa e rolar a página compete com arrastar o item. Duas
     * setas resolvem sem ambiguidade.
     */
    editorial.querySelectorAll('.seta').forEach(function (botao) {
      botao.addEventListener('click', function () {
        var item = botao.closest('.item-banco')
        var vizinho = botao.dataset.sobe
          ? item.previousElementSibling
          : item.nextElementSibling
        if (!vizinho) return
        if (botao.dataset.sobe) item.parentNode.insertBefore(item, vizinho)
        else item.parentNode.insertBefore(vizinho, item)
      })
    })

    /**
     * Quanto tempo a fila dura com a escolha atual.
     *
     * Sete dos trinta dias têm evento, então uns 23 puxam da fila. Com N por
     * dia, o banco marcado dura `marcados / N` dias de fila. A conta aparece na
     * tela porque a diferença é grande: um por dia dá quase dois meses, três
     * por dia dá menos de três semanas.
     */
    var atualizarDuracao = function () {
      var alvo = document.getElementById('dura-fila')
      if (!alvo) return
      var marcados = editorial.querySelectorAll('input[data-banco]:checked').length
      var n = Number((editorial.querySelector('input[name=por-dia]:checked') || {}).value || 1)
      if (!marcados) { alvo.textContent = 'nada marcado ainda' ; return }
      // ~23 dias de fila por mês: o resto do mês tem evento na agenda
      var dias = Math.round(marcados / n)
      alvo.textContent = marcados + ' marcado(s), dá para ' + dias +
        ' dia(s) de fila antes de repetir'
    }

    editorial.querySelectorAll('input[data-banco]').forEach(function (cx) {
      cx.addEventListener('change', function () {
        cx.closest('.item-banco').classList.toggle('on', cx.checked)
        atualizarDuracao()
      })
    })

    editorial.querySelectorAll('input[name=por-dia]').forEach(function (r) {
      r.addEventListener('change', function () {
        editorial.querySelectorAll('.qtd').forEach(function (l) {
          l.classList.toggle('on', l.querySelector('input').checked)
        })
        atualizarDuracao()
      })
    })

    atualizarDuracao()

    avisarRepetidos(editorial)
      })
    })

    avisarRepetidos(editorial)

    editorial.querySelectorAll('.formato input').forEach(function (cx) {
      cx.addEventListener('change', function () {
        cx.parentElement.classList.toggle('on', cx.checked)
      })
      // clicar num formato nao pode trocar o assunto marcado
      cx.parentElement.addEventListener('click', function (ev) { ev.stopPropagation() })
    })

    document.getElementById('salvar-pauta').addEventListener('click', function () {
      salvarPauta(this, editorial)
    })
  }

  /**
   * O mesmo assunto marcado em mais de um dia.
   *
   * O prefixo muda ("Faltam 3 dias", "Amanhã"), o conteúdo não: título, dado e
   * corpo saem iguais, e 9 das 12 linhas da legenda se repetem. Publicar os
   * quatro dias de véspera de um eclipse é publicar a mesma peça quatro vezes.
   *
   * O aviso é do tamanho do problema: um dia de véspera mais o dia do evento é
   * uma decisão editorial defensável; quatro não é. Quem decide continua sendo
   * quem lê o aviso.
   */
  function avisarRepetidos(editorial) {
    var porId = {}
    editorial.querySelectorAll('.assunto input[data-assunto]:checked').forEach(function (r) {
      (porId[r.value] = porId[r.value] || []).push(r.dataset.dia)
    })

    editorial.querySelectorAll('.assunto').forEach(function (el) {
      var alvo = el.querySelector('.repetido')
      var radio = el.querySelector('input[data-assunto]')
      if (!alvo || !radio) return
      // Só o assunto MARCADO avisa. O mesmo educativo é oferecido em vários
      // dias — sem isto, toda opção não marcada carregava um aviso escondido
      // pelo CSS, esperando a primeira mudança de regra para aparecer errado.
      if (!radio.checked) { alvo.textContent = ''; return }
      var dias = porId[radio.value] || []
      var outros = dias.filter(function (d) { return d !== radio.dataset.dia })
      alvo.textContent = outros.length
        ? 'Mesmo assunto em ' + outros.map(function (d) {
            return d.slice(8) + '/' + d.slice(5, 7)
          }).join(', ') + ' — o texto sai igual'
        : ''
    })
  }

  function salvarPauta(botao, editorial) {
    /**
     * A pauta passa a guardar uma LISTA de assuntos por dia.
     *
     * `opcoes` e o formato novo: cada item traz o id e os formatos daquele
     * assunto. `opcaoId` e `formatos` continuam sendo escritos, apontando para o
     * primeiro, porque ha pautas antigas no Storage e codigo que ainda le o
     * campo singular. Some quando nao houver mais nenhuma.
     */
    var porDia = {}
    editorial.querySelectorAll('.assunto input[data-assunto]:checked').forEach(function (r) {
      var dia = r.dataset.dia
      var caixa = r.closest('.assunto')
      var formatos = []
      caixa.querySelectorAll('.formato input:checked').forEach(function (cx) {
        formatos.push(cx.dataset.formato)
      })
      porDia[dia] = porDia[dia] || { opcoes: [] }
      porDia[dia].opcoes.push({ id: r.value, formatos: formatos })
    })

    Object.keys(porDia).forEach(function (dia) {
      var primeira = porDia[dia].opcoes[0]
      porDia[dia].opcaoId = primeira.id
      porDia[dia].formatos = primeira.formatos
    })

    /**
     * A fila do banco, na ordem em que está na tela.
     *
     * Só os marcados entram. A ordem é a do DOM, que é o que ele acabou de
     * arrumar com as setas — ler daqui evita manter um estado paralelo que
     * discorde do que está à vista.
     */
    var fila = []
    editorial.querySelectorAll('.item-banco').forEach(function (el) {
      var cx = el.querySelector('input[data-banco]')
      if (cx && cx.checked) fila.push(cx.value)
    })

    var dias = Object.keys(porDia)
    var aviso = document.getElementById('aviso-pauta')
    // fila sem nada marcado na agenda continua sendo trabalho a salvar: o
    // banco é a fonte da maioria dos dias
    if (!dias.length && !fila.length) {
      aviso.textContent = 'Nenhum assunto marcado.'
      setTimeout(function () { aviso.textContent = '' }, 2600)
      return
    }

    botao.disabled = true
    botao.textContent = 'Salvando…'

    var enviar = function (dia, arquivo, conteudo) {
      return fetch(BACKEND + '/api/marketing-cards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ultimaSenha },
        body: JSON.stringify({
          dia: dia,
          arquivo: arquivo,
          conteudoBase64: btoa(unescape(encodeURIComponent(JSON.stringify(conteudo))))
        })
      })
    }

    var envios = dias.map(function (dia) {
      return enviar(dia, 'pauta.json', {
        opcoes: porDia[dia].opcoes,
        opcaoId: porDia[dia].opcaoId,
        formatos: porDia[dia].formatos,
        salvoEm: new Date().toISOString()
      })
    })

    // A fila fica no dia de HOJE, um arquivo só: ela não pertence a data
    // nenhuma, e é isso que a distingue da agenda.
    var hojeISO = new Date().toISOString().slice(0, 10)
    var qtd = Number((editorial.querySelector('input[name=por-dia]:checked') || {}).value || 1)
    envios.push(enviar(hojeISO, 'fila.json', { itens: fila, porDia: qtd }))

    Promise.all(envios).then(function (rs) {
      var falhou = rs.filter(function (r) { return !r.ok }).length
      aviso.textContent = falhou
        ? falhou + ' envio(s) nao salvaram.'
        : 'Salvo: ' + dias.length + ' dia(s) e ' + fila.length + ' na fila.'
      botao.disabled = false
      botao.textContent = 'Salvar pauta'
      setTimeout(function () { aviso.textContent = '' }, 4000)
    })
  }

  /**
   * Apaga o dia inteiro no Storage.
   *
   * Existe porque uma peça errada chegou aqui e não havia como tirá-la: o cron
   * gerou o post do eclipse um dia antes, e ele ficou no Estúdio anunciando a
   * data errada. Confirma antes porque não tem volta.
   */
  function apagarDia(botao, dia) {
    if (!window.confirm('Apagar todas as peças de ' + dia + '? Não dá para desfazer.')) return

    botao.disabled = true
    botao.textContent = 'Apagando…'

    fetch(BACKEND + '/api/marketing-cards?dia=' + encodeURIComponent(dia), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + ultimaSenha }
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status)
      // recarrega do servidor: desenhar sem os dados novos mostraria o dia
      // vazio quando o DELETE tivesse falhado pela metade
      return carregar(ultimaSenha).then(function (dados) { desenhar(dados.dias || []) })
    }).catch(function () {
      botao.disabled = false
      botao.textContent = 'Não deu'
    })
  }

  /** Tem algo para baixar? Legenda sem imagem ainda é peça: dá para copiar. */
  function temPeca(d) {
    return !!(d.carta || d.reel || d.feed || d.story || d.legenda ||
      (d.carrossel && d.carrossel.length) || (d.extras && d.extras.length))
  }

  function desenhar(dias) {
    // A editorial é secundária; as peças são o motivo de a página existir. Um
    // erro ali derrubava o render inteiro e deixava a tela em branco — foi o que
    // aconteceu quando um calendário em formato velho encontrou o código novo.
    try {
      desenharEditorial(dias)
    } catch (e) {
      document.getElementById('editorial').innerHTML =
        '<summary>Editorial</summary>' +
        '<p class="vazio">Não consegui ler as pautas.<br>' +
        'As peças abaixo continuam disponíveis.</p>'
      if (window.console) console.error('editorial:', e)
    }

    // A lista é das PEÇAS. Um dia futuro com pauta marcada vem no mesmo payload
    // (a editorial precisa dele para saber o que está escolhido), mas não tem
    // imagem nenhuma — renderizado aqui virava um título solto com a data
    // embaixo e mais nada, oito vezes seguidas. O que está agendado se vê na
    // coluna da direita, que é onde se decide.
    var comPeca = dias.filter(temPeca)

    if (!comPeca.length) {
      lista.innerHTML = '<p class="vazio">Nenhuma peça enviada ainda.<br><br>' +
        (dias.some(function (d) { return d.pauta })
          ? 'Há pauta marcada para os próximos dias — as peças saem às 6h.'
          : 'No PC, rode:<br><code>node scripts/marketing/gerarCard.mjs --dias=9 --upload</code>')
        + '</p>'
      return
    }

    lista.innerHTML = comPeca.map(function (d, i) {
      function peca(url, rotulo, nome, larga, ehVideo) {
        if (!url) return ''
        var midia = ehVideo
          ? '<video src="' + url + '" controls playsinline preload="metadata"></video>'
          : '<img src="' + url + '" loading="lazy" decoding="async" alt="' + rotulo + ' de ' + d.dia + '">'
        return '<figure' + (larga ? ' class="larga"' : '') + '>' + midia +
          '<figcaption>' + rotulo +
            '<button type="button" class="baixar" data-url="' + url + '" data-nome="' + d.dia + '-' + nome + '">Baixar</button>' +
          '</figcaption></figure>'
      }

      // Os slides vêm na ordem do roteiro e são numerados na legenda da peça:
      // publicar carrossel fora de ordem estraga o encadeamento.
      var slides = (d.carrossel || []).map(function (url, n) {
        return peca(url, 'Slide ' + (n + 1), 'carrossel-' + String(n + 1).padStart(2, '0') + '.png', false, false)
      }).join('')

      // O post abre a lista.
      //
      // `feed.png` estava rotulado "Alternativa simples" e `carta.png`, "Post
      // principal" — verdade quando a carta era a peça do dia. Desde que a peça
      // de evento passou a sair em `feed.png`, o rótulo dizia ao João que a peça
      // principal era a alternativa. A carta continua saindo por comando.
      return '<article class="dia">' +
        '<h2>' + escapar(rotular(d.dia)) + '</h2>' +
        '<span class="iso">' + d.dia +
          '<button type="button" class="apagar" data-dia="' + d.dia + '">Apagar o dia</button>' +
        '</span>' +
        '<div class="pecas">' +
          peca(d.feed, 'Post', 'feed.png', true, false) +
          peca(d.story, 'Story', 'story.png', false, false) +
          peca(d.reel, 'Reel + Story', 'reel.mp4', true, true) +
          peca(d.carta, 'Post (formato antigo)', 'carta.png', false, false) +
        '</div>' +
        (slides
          ? '<h3 class="secao">Carrossel · ' + d.carrossel.length + ' slides, nesta ordem</h3>' +
            '<div class="pecas">' + slides + '</div>'
          : '') +
        (d.legenda
          ? '<pre id="leg-' + i + '">' + escapar(d.legenda) + '</pre>' +
            '<button type="button" class="copiar" data-i="' + i + '">Copiar legenda</button>'
          : '') +
        (d.enquete
          ? '<h3 class="secao">Enquete do story</h3>' +
            '<pre id="enq-' + i + '">' + escapar(d.enquete) + '</pre>'
          : '') +
        /**
         * As peças extras do dia.
         *
         * O dia tinha um slot só e a segunda peça sobrescrevia a primeira. Com
         * vários assuntos marcados na editorial, cada um vira uma peça com post,
         * story e carrossel proprios, guardada em `p2/` a `p5/`.
         */
        (d.extras || []).map(function (ex, n) {
          var slidesEx = (ex.carrossel || []).map(function (url, k) {
            return peca(url, 'Slide ' + (k + 1),
              ex.slot + '-carrossel-' + String(k + 1).padStart(2, '0') + '.png', false, false)
          }).join('')
          return '<h3 class="secao">Peça ' + (n + 2) + ' do dia</h3>' +
            '<div class="pecas">' +
              peca(ex.feed, 'Post', ex.slot + '-feed.png', true, false) +
              peca(ex.story, 'Story', ex.slot + '-story.png', false, false) +
            '</div>' +
            (slidesEx
              ? '<h3 class="secao">Carrossel da peça ' + (n + 2) + ' · ' +
                  ex.carrossel.length + ' slides</h3>' +
                '<div class="pecas">' + slidesEx + '</div>'
              : '') +
            (ex.legenda
              ? '<pre id="leg-' + i + '-' + (n + 2) + '">' + escapar(ex.legenda) + '</pre>' +
                '<button type="button" class="copiar" data-i="' + i + '-' + (n + 2) + '">' +
                  'Copiar legenda</button>'
              : '')
        }).join('') +
      '</article>'
    }).join('')

    lista.querySelectorAll('.baixar').forEach(function (botao) {
      botao.addEventListener('click', function () {
        baixar(botao, botao.dataset.url, botao.dataset.nome)
      })
    })

    lista.querySelectorAll('.apagar').forEach(function (botao) {
      botao.addEventListener('click', function () {
        apagarDia(botao, botao.dataset.dia)
      })
    })

    lista.querySelectorAll('.copiar').forEach(function (botao) {
      botao.addEventListener('click', function () {
        var alvo = document.getElementById('leg-' + botao.dataset.i)
        if (!alvo) return
        var ok = copiar(alvo.textContent)
        botao.textContent = ok ? 'Copiado' : 'Selecione e copie à mão'
        botao.classList.toggle('feito', ok)
        aviso.textContent = ok ? 'Legenda copiada.' : 'Não foi possível copiar automaticamente.'
        setTimeout(function () {
          botao.textContent = 'Copiar legenda'
          botao.classList.remove('feito')
          aviso.textContent = ''
        }, 2200)
      })
    })
  }

  function carregar(senha) {
    return fetch(BACKEND + '/api/marketing-cards', {
      headers: { Authorization: 'Bearer ' + senha }
    }).then(function (r) {
      if (r.status === 401) throw new Error('Senha incorreta.')
      if (!r.ok) throw new Error('Falha ao carregar (HTTP ' + r.status + ').')
      return r.json()
    })
  }

  function entrar(senha, salvar) {
    return carregar(senha).then(function (dados) {
      ultimaSenha = senha
      if (salvar) { try { localStorage.setItem(CHAVE, senha) } catch (e) {} }
      porta.classList.add('oculto')
      painel.classList.remove('oculto')
      desenhar(dados.dias || [])
    })
  }

  // No submit, não no clique: é o submit que o navegador escuta para oferecer
  // guardar a senha, e é ele que o Enter dispara sozinho — o listener de tecla
  // que existia aqui deixou de ser necessário.
  document.getElementById('form-login').addEventListener('submit', function (ev) {
    ev.preventDefault()
    var senha = document.getElementById('senha').value.trim()
    if (!senha) return
    erroLogin.classList.add('oculto')
    var botao = document.getElementById('entrar')
    botao.disabled = true
    entrar(senha, true).catch(function (e) {
      erroLogin.textContent = e.message
      erroLogin.classList.remove('oculto')
    }).finally(function () { botao.disabled = false })
  })

  document.getElementById('sair').addEventListener('click', function () {
    try { localStorage.removeItem(CHAVE) } catch (e) {}
    location.reload()
  })

  var guardada = null
  try { guardada = localStorage.getItem(CHAVE) } catch (e) {}
  if (guardada) {
    entrar(guardada, false).catch(function () {
      try { localStorage.removeItem(CHAVE) } catch (e) {}
    })
  }
})()
</script>

</body>
</html>
