<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="url(#bg)" rx="24"/>
  
  <!-- Outer circle -->
  <circle cx="96" cy="96" r="80" fill="none" stroke="#FFD700" stroke-width="4"/>
  
  <!-- Inner circle -->
  <circle cx="96" cy="96" r="60" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.7"/>
  
  <!-- Star points -->
  <g stroke="#FFD700" stroke-width="3" fill="none">
    <!-- Top -->
    <line x1="96" y1="16" x2="96" y2="36"/>
    <!-- Bottom -->
    <line x1="96" y1="156" x2="96" y2="176"/>
    <!-- Left -->
    <line x1="16" y1="96" x2="36" y2="96"/>
    <!-- Right -->
    <line x1="156" y1="96" x2="176" y2="96"/>
    <!-- Diagonal points -->
    <line x1="36" y1="36" x2="56" y2="56"/>
    <line x1="136" y1="136" x2="156" y2="156"/>
    <line x1="36" y1="156" x2="56" y2="136"/>
    <line x1="136" y1="56" x2="156" y2="36"/>
  </g>
  
  <!-- Center star -->
  <g fill="#FFD700">
    <circle cx="96" cy="96" r="8"/>
    <circle cx="96" cy="96" r="4" fill="#000000"/>
  </g>
  
  <!-- Constellation lines -->
  <g stroke="#FFD700" stroke-width="1" opacity="0.6">
    <line x1="60" y1="60" x2="80" y2="80"/>
    <line x1="112" y1="112" x2="132" y2="132"/>
    <line x1="60" y1="132" x2="80" y2="112"/>
    <line x1="112" y1="80" x2="132" y2="60"/>
  </g>
</svg>
