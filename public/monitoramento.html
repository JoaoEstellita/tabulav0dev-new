<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabulaEstelar — Monitoramento</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161a22;
      --border: #252b38;
      --accent: #7c6af7;
      --accent2: #e8b84b;
      --text: #e2e8f0;
      --muted: #8892a4;
      --ok: #3ecf8e;
      --warn: #e8b84b;
      --err: #f87171;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }

    #login-screen h1 {
      font-size: 1.4rem;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    #login-screen p { color: var(--muted); }

    #login-screen input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      width: 260px;
      outline: none;
    }

    #login-screen input:focus { border-color: var(--accent); }

    #login-screen button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 28px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    #login-screen button:hover { opacity: 0.88; }
    #login-error { color: var(--err); font-size: 13px; }

    /* ── Dashboard ── */
    #dashboard { display: none; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 { font-size: 1rem; color: var(--accent); font-weight: 700; }
    #last-update { color: var(--muted); font-size: 12px; }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    main {
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .metric-row:last-child { border-bottom: none; }

    .metric-label { color: var(--muted); }
    .metric-value { font-weight: 600; font-variant-numeric: tabular-nums; }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 700;
    }
    .badge-ok { background: rgba(62,207,142,.15); color: var(--ok); }
    .badge-warn { background: rgba(232,184,75,.15); color: var(--warn); }
    .badge-err { background: rgba(248,113,113,.15); color: var(--err); }

    .cron-row {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .cron-row:last-child { border-bottom: none; }
    .cron-name { font-weight: 600; font-size: 13px; }
    .cron-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .error-row {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .error-row:last-child { border-bottom: none; }
    .error-type { font-weight: 600; color: var(--err); font-size: 13px; }
    .error-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .loading { text-align: center; color: var(--muted); padding: 48px; }
    .error-msg { text-align: center; color: var(--err); padding: 48px; }

    /* card full-width */
    .card-full { grid-column: 1 / -1; }

    /* health banner + progress bar */
    .health-banner { grid-column: 1 / -1; padding: 12px 18px; border-radius: var(--radius); font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .health-ok { background: rgba(62,207,142,.12); color: var(--ok); border: 1px solid rgba(62,207,142,.3); }
    .health-warn { background: rgba(232,184,75,.12); color: var(--warn); border: 1px solid rgba(232,184,75,.3); }
    .health-err { background: rgba(248,113,113,.12); color: var(--err); border: 1px solid rgba(248,113,113,.3); }
    .pbar { margin-top: 6px; height: 8px; background: #0d0f14; border-radius: 99px; overflow: hidden; }
    .pbar > div { height: 100%; border-radius: 99px; transition: width .4s ease; }
    .links a { color: var(--accent); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <h1>✦ TabulaEstelar</h1>
  <p>Acesso restrito — informe a senha</p>
  <input id="pwd-input" type="password" placeholder="Senha" autocomplete="current-password">
  <button onclick="doLogin()">Entrar</button>
  <span id="login-error"></span>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <header>
    <h1>✦ TabulaEstelar — Monitoramento</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="last-update">—</span>
      <button class="refresh-btn" onclick="loadData(true)">↻ Atualizar</button>
    </div>
  </header>
  <main id="main-content">
    <div class="loading">Carregando…</div>
  </main>
</div>

<script>
  const BACKEND = 'https://tabulav0dev-backend.vercel.app'

  function getPassword() {
    return sessionStorage.getItem('mon_pwd') || ''
  }

  function doLogin() {
    const pwd = document.getElementById('pwd-input').value.trim()
    if (!pwd) return
    sessionStorage.setItem('mon_pwd', pwd)
    showDashboard()
  }

  document.getElementById('pwd-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin()
  })

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('dashboard').style.display = 'block'
    loadData(true)
  }

  // withUsers=true busca a lista completa de usuários (~1 read/usuário); o
  // auto-refresh de 60s chama sem isso (só contagens baratas), mantendo a
  // tabela já carregada. Assim o painel aberto não sangra leituras.
  async function loadData(withUsers) {
    const main = document.getElementById('main-content')
    if (!window.__usuarios) main.innerHTML = '<div class="loading">Carregando…</div>'

    try {
      const res = await fetch(`${BACKEND}/api/monitoring${withUsers ? '?users=1' : ''}`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${getPassword()}`,
          'Content-Type': 'application/json',
        }
      })

      if (res.status === 401) {
        sessionStorage.removeItem('mon_pwd')
        document.getElementById('login-error').textContent = 'Senha incorreta.'
        document.getElementById('login-screen').style.display = 'flex'
        document.getElementById('dashboard').style.display = 'none'
        return
      }

      if (!res.ok) throw new Error(`HTTP ${res.status}`)

      const data = await res.json()
      document.getElementById('last-update').textContent =
        'Atualizado às ' + new Date().toLocaleTimeString('pt-BR')
      renderDashboard(data)
    } catch (err) {
      main.innerHTML = `<div class="error-msg">Erro ao carregar dados: ${err.message}</div>`
    }
  }

  function fmtDur(ms) {
    if (ms == null) return '—'
    if (ms < 1000) return `${ms}ms`
    return `${(ms / 1000).toFixed(1)}s`
  }

  function timeAgo(iso) {
    if (!iso) return '—'
    const diff = Date.now() - new Date(iso).getTime()
    const m = Math.floor(diff / 60000)
    if (m < 1) return 'agora'
    if (m < 60) return `${m}min atrás`
    const h = Math.floor(m / 60)
    if (h < 24) return `${h}h atrás`
    return `${Math.floor(h / 24)}d atrás`
  }

  function statusBadge(status) {
    if (!status || status === 'unknown') return `<span class="badge badge-warn">?</span>`
    if (status === 'ok' || status === 'success') return `<span class="badge badge-ok">OK</span>`
    if (status === 'error' || status === 'failed') return `<span class="badge badge-err">ERRO</span>`
    return `<span class="badge badge-warn">${status}</span>`
  }

  function pct(v, cap) { if (v == null || !cap) return 0; return Math.min(100, Math.round((v / cap) * 100)) }
  function barColor(p) { return p >= 90 ? 'var(--err)' : p >= 70 ? 'var(--warn)' : 'var(--ok)' }
  function progressBar(v, cap) {
    const p = pct(v, cap)
    return `<div class="pbar"><div style="width:${p}%;background:${barColor(p)}"></div></div>`
  }
  function fmtNum(n) { return n == null ? '—' : Number(n).toLocaleString('pt-BR') }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
  function fmtBRL(n) { return n == null ? '—' : 'R$ ' + Number(n).toFixed(2) }

  function renderDashboard(d) {
    const main = document.getElementById('main-content')
    const s = d.sistema || {}
    const u = d.usuarios || {}
    // Só atualiza a lista quando ela veio (load/manual/ação); auto-refresh mantém a atual.
    if (Array.isArray(u.lista)) window.__usuarios = u.lista
    window.__usuarios = window.__usuarios || []
    const subs = computeSubs(window.__usuarios)
    const n = d.notificacoes || {}
    const crons = d.crons || []
    const leituras = d.leituras || {}
    const erros = d.erros24h || {}
    const ag = d.agente || {}
    const ass = d.assinantes || {}
    const fs = d.firestore || {}

    const sistemaBadge = s.uptimeSec > 0
      ? `<span class="badge badge-ok">Online</span>`
      : `<span class="badge badge-err">Offline</span>`

    // Saúde geral
    const fsPct = fs.available ? pct(fs.readsToday, fs.readsCap) : 0
    const hasErrors = (erros.total || 0) > 0 || (d.appErrors?.count24h || 0) > 0
    // Blaze NÃO trava — passar do tier grátis só cobra o excedente (US$0,06/100k leituras).
    const overReads = fs.available ? Math.max(0, (fs.readsToday || 0) - (fs.readsCap || 0)) : 0
    const custoUsd = (overReads / 100000 * 0.06)
    let health = { cls: 'health-ok', txt: '✓ Tudo certo — sistema online, sem erros, leituras dentro do tier grátis.' }
    if (!(s.uptimeSec > 0)) health = { cls: 'health-err', txt: '⚠ Sistema offline.' }
    else if (fsPct >= 90) health = { cls: 'health-warn', txt: `Firestore em ${fsPct}% do tier grátis — excedente de hoje ~US$${custoUsd.toFixed(2)} (Blaze cobra, não trava).` }
    else if (fsPct >= 70) health = { cls: 'health-warn', txt: `Firestore em ${fsPct}% do tier grátis — de olho no custo.` }
    else if (hasErrors) health = { cls: 'health-warn', txt: 'Há erros registrados nas últimas 24h — confira abaixo.' }

    main.innerHTML = `
      <div class="health-banner ${health.cls}">${health.txt}</div>

      <!-- Firestore quota -->
      <div class="card">
        <div class="card-title">Firestore — Quota Grátis (hoje UTC)</div>
        ${fs.available ? `
          <div class="metric-row">
            <span class="metric-label">Leituras</span>
            <span class="metric-value" style="color:${barColor(pct(fs.readsToday, fs.readsCap))}">${fmtNum(fs.readsToday)} / ${fmtNum(fs.readsCap)}</span>
          </div>
          ${progressBar(fs.readsToday, fs.readsCap)}
          <div class="metric-row" style="margin-top:12px">
            <span class="metric-label">Escritas</span>
            <span class="metric-value" style="color:${barColor(pct(fs.writesToday, fs.writesCap))}">${fmtNum(fs.writesToday)} / ${fmtNum(fs.writesCap)}</span>
          </div>
          ${progressBar(fs.writesToday, fs.writesCap)}
          ${(() => {
            const rp = d.readsPorFonte
            if (!rp || !(rp.fontes && rp.fontes.length)) return ''
            const rows = rp.fontes.slice(0, 8).map(f => `
              <div class="metric-row" style="padding:2px 0">
                <span class="metric-label" style="font-size:12px">${esc(f.fonte)}</span>
                <span class="metric-value" style="font-size:12px">${fmtNum(f.leituras)}</span>
              </div>`).join('')
            const outros = rp.clienteOutros != null ? `
              <div class="metric-row" style="padding:2px 0">
                <span class="metric-label" style="font-size:12px;color:var(--muted)">cliente / outros (SDK do app)</span>
                <span class="metric-value" style="font-size:12px;color:var(--muted)">${fmtNum(rp.clienteOutros)}</span>
              </div>` : ''
            return `<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px">
              <div class="metric-label" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px">Leituras por fonte (hoje) — atribuído: ${fmtNum(rp.atribuidoBackend)}</div>
              ${rows}${outros}
            </div>`
          })()}
        ` : `<div style="color:var(--muted);font-size:13px;line-height:1.5">
            Indisponível. Conceda <b style="color:var(--text)">roles/monitoring.viewer</b> ao service account no GCP IAM.
            <br><span style="color:var(--warn);font-size:12px">${fs.reason || ''}</span>
          </div>`}
      </div>

      <!-- Agente WhatsApp -->
      <div class="card">
        <div class="card-title">Agente WhatsApp (hoje)</div>
        <div class="metric-row">
          <span class="metric-label">Chamadas LLM</span>
          <span class="metric-value" style="color:${barColor(pct(ag.globalCount, ag.globalCap))}">${fmtNum(ag.globalCount)} / ${fmtNum(ag.globalCap)}</span>
        </div>
        ${progressBar(ag.globalCount, ag.globalCap)}
        <div class="metric-row" style="margin-top:12px">
          <span class="metric-label">Custo estimado</span>
          <span class="metric-value" style="color:var(--accent2)">${fmtBRL(ag.custoEstimadoBRL)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Mensagens hoje</span>
          <span class="metric-value">${fmtNum(ag.mensagensHoje)}</span>
        </div>
      </div>

      <!-- Assinantes -->
      <div class="card">
        <div class="card-title">Assinantes</div>
        <div class="metric-row">
          <span class="metric-label">Usuários totais</span>
          <span class="metric-value">${fmtNum(ass.total ?? u.total)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Pagantes reais</span>
          <span class="metric-value" style="color:var(--ok)">${fmtNum(subs.pagantes)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Cortesias (admin)</span>
          <span class="metric-value" style="color:var(--muted)">${fmtNum(subs.cortesias)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Trial</span>
          <span class="metric-value">${fmtNum(subs.trial ?? ass.trial)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Essential / Pro / Premium (pagantes)</span>
          <span class="metric-value">${fmtNum(subs.byPlan.essential_monthly)} / ${fmtNum(subs.byPlan.pro_monthly)} / ${fmtNum(subs.byPlan.premium_monthly)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Recorrente / mês (MRR)</span>
          <span class="metric-value" style="color:var(--accent2)">${fmtBRL(subs.mrr)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Único recebido (mês)</span>
          <span class="metric-value" style="color:var(--accent2)">${fmtBRL(subs.oneTime)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Ativos (7 dias)</span>
          <span class="metric-value">${fmtNum(u.ativos7d)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Online agora (&lt;10min)</span>
          <span class="metric-value" style="color:var(--ok)">${fmtNum(u.online)}</span>
        </div>
      </div>

      <!-- Sistema -->
      <div class="card">
        <div class="card-title">Sistema</div>
        <div class="metric-row">
          <span class="metric-label">Status</span>
          <span class="metric-value">${sistemaBadge}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Uptime</span>
          <span class="metric-value">${fmtDur((s.uptimeSec || 0) * 1000)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Tempo de resposta</span>
          <span class="metric-value">${fmtDur(s.responseMs)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Ambiente</span>
          <span class="metric-value">${s.env || '—'}</span>
        </div>
      </div>

      <!-- Notificações -->
      <div class="card">
        <div class="card-title">Notificações</div>
        <div class="metric-row">
          <span class="metric-label">Fila pendente (hot_queue)</span>
          <span class="metric-value" style="${(n.filaPendente || 0) > 100 ? 'color:var(--warn)' : ''}">${n.filaPendente ?? '—'}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Enviadas hoje</span>
          <span class="metric-value">${n.enviadasHoje ?? '—'}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Subscriptions web push</span>
          <span class="metric-value">${n.subscriptionsWebPush ?? '—'}</span>
        </div>
      </div>

      <!-- Leituras -->
      <div class="card">
        <div class="card-title">Leituras de Áreas</div>
        <div class="metric-row">
          <span class="metric-label">Hoje</span>
          <span class="metric-value" style="color:var(--accent)">${leituras.totalHoje ?? '—'}</span>
        </div>
      </div>

      <!-- Leituras recentes -->
      <div class="card card-full">
        <div class="card-title">Leituras Recentes (últimas 20)</div>
        ${!(leituras.recentes?.length)
          ? '<div style="color:var(--muted)">Nenhuma leitura registrada ainda.</div>'
          : `<table style="width:100%;border-collapse:collapse;font-size:13px">
              <thead>
                <tr style="color:var(--muted);text-align:left;border-bottom:1px solid var(--border)">
                  <th style="padding:4px 8px">Área</th>
                  <th style="padding:4px 8px">Score</th>
                  <th style="padding:4px 8px">Trend</th>
                  <th style="padding:4px 8px">Fonte</th>
                  <th style="padding:4px 8px">Quando</th>
                </tr>
              </thead>
              <tbody>
                ${(leituras.recentes || []).map(r => {
                  const trendColor = r.areaTrend === 'positive' ? 'var(--ok)' : r.areaTrend === 'negative' ? 'var(--err)' : 'var(--muted)'
                  const srcBadge = r.source === 'whatsapp_agent'
                    ? '<span class="badge badge-warn">WA</span>'
                    : '<span class="badge" style="background:#2a3a55;color:var(--text)">App</span>'
                  return `<tr style="border-bottom:1px solid var(--border)">
                    <td style="padding:5px 8px">${r.areaName || '—'}</td>
                    <td style="padding:5px 8px;font-weight:600">${r.areaScore != null ? r.areaScore : '—'}</td>
                    <td style="padding:5px 8px;color:${trendColor}">${r.areaTrend || '—'}</td>
                    <td style="padding:5px 8px">${srcBadge}</td>
                    <td style="padding:5px 8px;color:var(--muted)">${timeAgo(r.readAt)}</td>
                  </tr>`
                }).join('')}
              </tbody>
            </table>`
        }
      </div>

      <!-- Usuários — lista completa + ações admin -->
      <div class="card card-full">
        <div class="card-title">Usuários${u.online != null ? ` · <span style="color:var(--ok)">${fmtNum(u.online)} online</span>` : ''} · <span style="color:var(--muted)">${fmtNum((window.__usuarios || []).length)} no total</span></div>
        <input id="user-search" type="text" placeholder="Buscar por nome ou e-mail…" oninput="renderUsersTable()"
          style="width:100%;max-width:360px;margin:2px 0 12px;padding:8px 10px;background:#141428;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px" />
        <div id="users-table" style="overflow-x:auto"></div>
      </div>

      <!-- Erros 24h -->
      <div class="card">
        <div class="card-title">Erros (últimas 24h)</div>
        ${(erros.total || 0) === 0
          ? '<div class="metric-row"><span class="metric-label" style="color:var(--ok)">Nenhum erro registrado ✓</span></div>'
          : `<div class="metric-row">
              <span class="metric-label">Total</span>
              <span class="metric-value" style="color:var(--err)">${erros.total}</span>
             </div>
             ${(erros.itens || []).slice(0, 5).map(e => `
               <div class="error-row">
                 <div class="error-type">${e.type}</div>
                 <div class="error-meta">${e.message || ''} ${e.ip ? '— IP: ' + e.ip : ''} — ${timeAgo(e.at)}</div>
               </div>`).join('')}`
        }
      </div>

      <!-- Crons -->
      <div class="card card-full">
        <div class="card-title">Crons — último run</div>
        ${crons.length === 0
          ? '<div style="color:var(--muted)">Crons desativados (interino — restaurar pós-Blaze). Nenhum log recente.</div>'
          : crons.map(c => `
            <div class="cron-row">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span class="cron-name">${c.name}</span>
                ${statusBadge(c.status)}
              </div>
              <div class="cron-meta">
                ${timeAgo(c.runAt)}
                ${c.durationMs != null ? ' · ' + fmtDur(c.durationMs) : ''}
                ${c.error ? ' · <span style="color:var(--err)">' + c.error + '</span>' : ''}
              </div>
            </div>`).join('')
        }
      </div>

      <!-- Links rápidos -->
      <div class="card card-full links">
        <div class="card-title">Links rápidos</div>
        <div style="display:flex;flex-wrap:wrap;gap:16px;font-size:13px">
          <a href="https://console.cloud.google.com/firestore/databases/-default-/usage?project=tabula-estelar-84fdc" target="_blank" rel="noopener">Quota Firestore (GCP)</a>
          <a href="https://console.cloud.google.com/billing?project=tabula-estelar-84fdc" target="_blank" rel="noopener">Billing / Orçamento</a>
          <a href="https://console.cloud.google.com/iam-admin/iam?project=tabula-estelar-84fdc" target="_blank" rel="noopener">IAM (conceder monitoring.viewer)</a>
        </div>
      </div>
    `
    renderUsersTable()
  }

  // ── Tabela de usuários (filtro client-side + ações admin) ──────────────────
  const PLAN_OPTS = [['premium_monthly', 'Premium'], ['pro_monthly', 'Pro'], ['essential_monthly', 'Essential']]

  // Distingue PAGANTE real de cortesia. Uma venda do webhook NÃO grava source
  // (fica null), então só conta receita quem tem prova de pagamento:
  //  - kind 'one_time'/'recurring' (ativação manual marcada como paga), OU
  //  - source 'manual_paid'/provider de venda, OU
  //  - subHasPayment (paymentId/paymentMethod do webhook real).
  // Tudo o mais (source admin/monitoring, ou null/não classificado) = cortesia,
  // pra NUNCA inflar faturamento com ativação manual.
  const SUB_PRICES = { essential_monthly: 19.90, pro_monthly: 47.90, premium_monthly: 79.90 }
  const ADMIN_SOURCES = new Set(['admin', 'monitoring'])
  const PAID_SOURCES = new Set(['manual_paid', 'mercadopago', 'mercado-pago', 'mercado-pago-webhook', 'stripe', 'pix'])
  function isPagante(u) {
    if (u.subKind === 'one_time' || u.subKind === 'recurring') return true
    if (u.subKind === 'cortesia') return false
    if (ADMIN_SOURCES.has(u.subSource)) return false
    if (u.subHasPayment) return true
    if (PAID_SOURCES.has(u.subSource)) return true
    return false // null/desconhecido → não conta receita
  }
  function computeSubs(list) {
    // mrr = só assinatura recorrente (recorre todo mês). oneTime = pagamento único
    // do mês (PIX de 1 mês NÃO recorre). Pago legado sem kind = tratado como único.
    const r = { pagantes: 0, cortesias: 0, trial: 0, mrr: 0, oneTime: 0, byPlan: { essential_monthly: 0, pro_monthly: 0, premium_monthly: 0 } }
    for (const u of (list || [])) {
      if (u.subStatus === 'trial') { r.trial++; continue }
      if (u.subStatus !== 'active') continue
      if (!isPagante(u)) { r.cortesias++; continue }
      r.pagantes++
      if (r.byPlan[u.subPlan] != null) r.byPlan[u.subPlan]++
      const price = SUB_PRICES[u.subPlan] || 0
      if (u.subKind === 'recurring') r.mrr += price
      else r.oneTime += price
    }
    return r
  }
  // Prazo do modo gratuito: 7 dias a partir de users.trialStart (espelha
  // useSubscriptionCheck). Assinante ativo não está no gratuito → '—'.
  const TRIAL_DAYS = 7
  function trialInfo(u) {
    if (u.subStatus === 'active' && (isPagante(u) || ADMIN_SOURCES.has(u.subSource))) return { txt: '—', bg: 'transparent', fg: 'var(--muted)' }
    if (u.subStatus === 'trial') return { txt: '—', bg: 'transparent', fg: 'var(--muted)' }
    if (!u.trialStart) return { txt: 'não iniciado', bg: '#2a3a55', fg: 'var(--muted)' }
    const start = new Date(u.trialStart).getTime()
    if (!Number.isFinite(start)) return { txt: '—', bg: 'transparent', fg: 'var(--muted)' }
    const restam = Math.ceil(TRIAL_DAYS - (Date.now() - start) / 86400000)
    if (restam <= 0) return { txt: 'expirado', bg: '#3a2020', fg: '#ff8a80' }
    if (restam <= 2) return { txt: `${restam}d grátis`, bg: '#3a3417', fg: '#f0e08f' }
    return { txt: `${restam}d grátis`, bg: '#173a2a', fg: '#8ff0c0' }
  }

  // Rótulo do tipo mostrado na lista.
  function subTipo(u) {
    if (u.subStatus !== 'active') return null
    if (u.subKind === 'recurring') return { txt: 'assinatura', bg: '#173a2a', fg: '#8ff0c0' }
    if (u.subKind === 'one_time') return { txt: 'pago (único)', bg: '#173a2a', fg: '#8ff0c0' }
    if (isPagante(u)) return { txt: 'pago', bg: '#173a2a', fg: '#8ff0c0' }
    return { txt: 'cortesia', bg: '#3a3417', fg: '#f0e08f' }
  }

  function remaining(iso) {
    if (!iso) return 'sem prazo'
    const end = new Date(iso).getTime()
    if (!Number.isFinite(end)) return ''
    const ms = end - Date.now()
    if (ms <= 0) return 'expirado'
    const days = Math.ceil(ms / 86400000)
    if (days >= 45) return `~${Math.round(days / 30)} meses`
    if (days >= 1) return `${days} dia${days > 1 ? 's' : ''}`
    return 'hoje'
  }

  function subBadge(r) {
    const p = r.subPlan ? ` ${r.subPlan.replace('_monthly', '')}` : ''
    const t = subTipo(r)
    const tipoTag = t ? ` <span class="badge" style="background:${t.bg};color:${t.fg};font-size:10px">${t.txt}</span>` : ''
    const sub = (badge, remIso) => `${badge}${tipoTag}<div style="color:var(--muted);font-size:11px;margin-top:2px">${remaining(remIso)}</div>`
    if (r.subStatus === 'active') return sub(`<span class="badge badge-ok">ativo${p}</span>`, r.subExpiresAt)
    if (r.subStatus === 'trial') return sub(`<span class="badge badge-warn">trial${p}</span>`, r.subTrialEnds)
    if (r.subStatus === 'canceled') return `<span class="badge" style="background:#3a2020;color:#ff8a80">cancelado</span>`
    return `<span class="badge" style="background:#2a3a55;color:var(--muted)">—</span>`
  }

  function renderUsersTable() {
    const box = document.getElementById('users-table')
    if (!box) return
    const q = (document.getElementById('user-search')?.value || '').trim().toLowerCase()
    const all = window.__usuarios || []
    const list = q
      ? all.filter(r => (r.nome || '').toLowerCase().includes(q) || (r.email || '').toLowerCase().includes(q))
      : all
    if (!list.length) { box.innerHTML = '<div style="color:var(--muted)">Nenhum usuário.</div>'; return }
    box.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:13px;min-width:820px">
      <thead>
        <tr style="color:var(--muted);text-align:left;border-bottom:1px solid var(--border)">
          <th style="padding:4px 8px"></th><th style="padding:4px 8px">Usuário</th><th style="padding:4px 8px">E-mail</th>
          <th style="padding:4px 8px">Aberturas hoje</th><th style="padding:4px 8px">Último acesso</th>
          <th style="padding:4px 8px">Assinatura</th><th style="padding:4px 8px">Gratuito</th><th style="padding:4px 8px">Ações</th>
        </tr>
      </thead>
      <tbody>
        ${list.map(r => {
          const dot = r.online ? '<span style="color:var(--ok)" title="online">●</span>' : '<span style="color:var(--muted)" title="offline">○</span>'
          const sel = `<select id="plan-${r.uid}" style="background:#141428;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 4px;font-size:12px">${PLAN_OPTS.map(([v, l]) => `<option value="${v}"${r.subPlan === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`
          return `<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:5px 8px">${dot}</td>
            <td style="padding:5px 8px">${esc(r.nome) || '—'}</td>
            <td style="padding:5px 8px;color:var(--muted)">${esc(r.email) || '—'}</td>
            <td style="padding:5px 8px">${r.loginsHoje != null ? r.loginsHoje : '—'}</td>
            <td style="padding:5px 8px;color:var(--muted)">${timeAgo(r.ultimoAcesso)}</td>
            <td style="padding:5px 8px">${subBadge(r)}</td>
            <td style="padding:5px 8px">${(() => { const g = trialInfo(r); return g.bg === 'transparent' ? `<span style="color:${g.fg}">${g.txt}</span>` : `<span class="badge" style="background:${g.bg};color:${g.fg};font-size:11px">${g.txt}</span>` })()}</td>
            <td style="padding:5px 8px;white-space:nowrap">
              ${sel}
              <input id="months-${r.uid}" type="number" min="0" max="24" value="1" title="meses (0 = sem prazo)" style="width:44px;margin-left:4px;background:#141428;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 4px;font-size:12px" />
              <select id="kind-${r.uid}" title="cortesia não conta receita; único = 1 mês pago; assinatura = pago recorrente" style="margin-left:4px;background:#141428;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 4px;font-size:12px"><option value="cortesia">Cortesia</option><option value="one_time">Pagamento único</option><option value="recurring">Assinatura</option></select>
              <button onclick="userAction('${r.uid}','activate')" style="margin-left:4px;padding:3px 8px;background:var(--ok);color:#04120a;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">Ativar</button>
              <button onclick="userAction('${r.uid}','trial')" style="margin-left:4px;padding:3px 8px;background:var(--warn);color:#1a1400;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">Trial</button>
              <button onclick="userAction('${r.uid}','deactivate')" style="margin-left:4px;padding:3px 8px;background:#3a2020;color:#ff8a80;border:1px solid #5a2a2a;border-radius:6px;font-size:12px;cursor:pointer">Desativar</button>
            </td>
          </tr>`
        }).join('')}
      </tbody>
    </table>`
  }

  async function userAction(uid, action) {
    if (action === 'deactivate' && !confirm('Desativar a assinatura deste usuário?')) return
    const planId = document.getElementById('plan-' + uid)?.value || 'premium_monthly'
    const trialDays = action === 'trial' ? (parseInt(prompt('Dias de trial:', '7'), 10) || 7) : undefined
    let months, kind
    if (action === 'activate') {
      const m = parseInt(document.getElementById('months-' + uid)?.value, 10)
      months = Number.isFinite(m) ? m : 1
      kind = document.getElementById('kind-' + uid)?.value || 'cortesia'
    }
    try {
      const res = await fetch(`${BACKEND}/api/monitoring-action`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${getPassword()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid, action, planId, trialDays, months, kind }),
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok || !data.ok) { alert('Falha: ' + (data.error || res.status)); return }
      loadData(true)
    } catch (e) { alert('Erro: ' + e.message) }
  }

  // Auto-login se senha já salva
  if (getPassword()) showDashboard()

  // Auto-refresh a cada 60s — SEM a lista de usuários (só contagens baratas),
  // pra não sangrar leituras com o painel aberto.
  setInterval(() => {
    if (document.getElementById('dashboard').style.display !== 'none') {
      loadData(false)
    }
  }, 60000)
</script>
</body>
</html>
