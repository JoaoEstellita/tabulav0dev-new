<script>

  (function () {
    try {
      var c = new URLSearchParams(location.search).get('code');
      c = String(c || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40);

    } catch (e) {}

<title>Parceria Estelar · Tábula Estelar</title>
<meta name="description" content="Programa de parceria do Tábula Estelar — indique astrologia de verdade e receba 50% do lucro de cada assinante.">
<link rel="icon" href="/icon-512.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A1C; --panel:#12122C; --panel-2:#1A1A38;
    --gold:#E9C46A; --gold-bright:#FFDD8A; --gold-deep:#C9A24B;
    --star:#F4ECD9; --mist:#9DA2C6; --mist-dim:#6E7399;
    --line:rgba(233,196,106,.18); --line-soft:rgba(255,255,255,.07);
    --good:#6FD9AC; --maxw:1080px;
  }
  *{box-sizing:border-box} html{scroll-behavior:smooth}
  body{margin:0;background:var(--ink);color:var(--star);
    font-family:'Mulish',system-ui,sans-serif;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  img{max-width:100%}
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(233,196,106,.10), transparent 60%),
      radial-gradient(900px 600px at 85% 15%, rgba(120,110,220,.10), transparent 55%),
      radial-gradient(2px 2px at 20% 30%, rgba(244,236,217,.7), transparent),
      radial-gradient(2px 2px at 70% 20%, rgba(244,236,217,.55), transparent),
      radial-gradient(1.5px 1.5px at 40% 50%, rgba(244,236,217,.5), transparent),
      radial-gradient(1.5px 1.5px at 88% 60%, rgba(244,236,217,.45), transparent),
      radial-gradient(1px 1px at 12% 70%, rgba(244,236,217,.5), transparent),
      radial-gradient(1.5px 1.5px at 60% 78%, rgba(244,236,217,.4), transparent),
      radial-gradient(1px 1px at 33% 88%, rgba(244,236,217,.45), transparent),
      radial-gradient(1px 1px at 78% 40%, rgba(244,236,217,.4), transparent);}
  .twinkle{position:fixed;z-index:0;width:3px;height:3px;border-radius:50%;
    background:var(--gold-bright);box-shadow:0 0 6px 1px rgba(255,221,138,.7);animation:tw 4s ease-in-out infinite}
  .twinkle.a{top:18%;left:26%;animation-delay:.2s}.twinkle.b{top:24%;left:74%;animation-delay:1.4s}
  .twinkle.c{top:64%;left:14%;animation-delay:2.6s}.twinkle.d{top:72%;left:82%;animation-delay:.9s}
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
  @media (prefers-reduced-motion:reduce){.twinkle{animation:none;opacity:.6}html{scroll-behavior:auto}}

  .wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 24px}
  section{position:relative;z-index:1}

  /* Seletor de idioma */
  .lang{position:fixed;top:16px;right:16px;z-index:5;display:flex;gap:2px;
    background:rgba(18,18,44,.8);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(8px)}
  .lang button{border:none;background:transparent;color:var(--mist);font-family:'Mulish';font-weight:800;
    font-size:12px;letter-spacing:.05em;padding:6px 12px;border-radius:999px;cursor:pointer}
  .lang button.on{background:var(--gold);color:#241a05}
  .lang button:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}

  .eyebrow{font-family:'Mulish';text-transform:uppercase;letter-spacing:.22em;font-size:12px;font-weight:800;color:var(--gold);opacity:.9}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;text-wrap:balance;font-weight:600;line-height:1.08;margin:0}
  .lede{color:var(--mist);font-size:19px}

  .hero{max-width:var(--maxw);margin:0 auto;padding:78px 24px 40px;text-align:center}
  .logo{width:150px;height:150px;border-radius:28px;object-fit:cover;
    box-shadow:0 0 0 1px var(--line),0 24px 70px -20px rgba(233,196,106,.5),0 10px 40px rgba(0,0,0,.6);margin:0 auto 26px;display:block}
  .hero h1{font-size:clamp(34px,6vw,60px);font-weight:600;letter-spacing:-.01em;margin-top:16px}
  .hero h1 em{font-style:italic;color:var(--gold-bright)}
  .hero .lede{max-width:60ch;margin:22px auto 0;font-size:clamp(16px,2.4vw,20px)}
  .hero .lede strong{color:var(--star)}
  .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}
  .btn{display:inline-flex;align-items:center;gap:10px;font-family:'Mulish';font-weight:800;font-size:16px;
    padding:15px 28px;border-radius:999px;text-decoration:none;cursor:pointer;border:none;transition:transform .15s,box-shadow .15s}
  .btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold-deep));color:#241a05;box-shadow:0 10px 30px -8px rgba(233,196,106,.55)}
  .btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 40px -8px rgba(233,196,106,.7)}
  .btn-ghost{background:transparent;color:var(--star);border:1px solid var(--line);padding:14px 24px}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-bright)}
  .btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}

  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);max-width:var(--maxw);margin:8px auto}
  .block{padding:56px 0}
  .block>.head{max-width:62ch}
  .head h2{font-size:clamp(26px,4vw,40px);margin-top:12px}
  .head p{color:var(--mist);font-size:17px;margin:14px 0 0}
  .feat{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:34px}
  .feat .it{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line-soft);border-radius:16px;padding:22px}
  .feat .it .g{font-size:22px;line-height:1;color:var(--gold-bright);font-family:'Fraunces',serif}
  .feat .it h3{font-size:19px;margin-top:12px;font-weight:600}
  .feat .it p{color:var(--mist);font-size:15px;margin:8px 0 0}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px;counter-reset:s}
  .step{position:relative;background:linear-gradient(180deg,rgba(26,26,56,.7),rgba(18,18,44,.7));border:1px solid var(--line-soft);border-radius:18px;padding:28px 22px 24px}
  .step .n{counter-increment:s;font-family:'Fraunces',serif;font-size:40px;font-weight:600;color:var(--gold);line-height:1;opacity:.55}
  .step .n::before{content:counter(s,decimal-leading-zero)}
  .step h3{font-size:20px;margin-top:10px;font-weight:600}
  .step p{color:var(--mist);font-size:15px;margin:8px 0 0}

  .money{max-width:var(--maxw);margin:14px auto;text-align:center;padding:64px 24px;
    background:radial-gradient(700px 340px at 50% 30%, rgba(233,196,106,.14), transparent 70%);border-radius:28px}
  .money .big{font-family:'Fraunces',serif;font-weight:900;letter-spacing:-.02em;font-size:clamp(88px,20vw,190px);line-height:.9;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 20px 80px rgba(233,196,106,.25)}
  .money .cap{font-family:'Fraunces',serif;font-size:clamp(22px,4vw,34px);font-weight:500;margin-top:4px}
  .money p{color:var(--mist);font-size:17px;max-width:56ch;margin:20px auto 0}
  .money .tags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .tag{font-size:13px;font-weight:700;color:var(--gold-bright);border:1px solid var(--line);border-radius:999px;padding:8px 16px;background:rgba(233,196,106,.06)}

  .panel-mock{margin-top:30px;background:linear-gradient(180deg,var(--panel),#0E0E24);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
  .panel-mock .bar{display:flex;align-items:center;gap:8px;color:var(--mist-dim);font-size:12px;padding-bottom:16px;border-bottom:1px solid var(--line-soft);font-weight:700;letter-spacing:.04em}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);opacity:.5}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
  .tile{background:rgba(255,255,255,.02);border:1px solid var(--line-soft);border-radius:14px;padding:16px}
  .tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mist-dim);font-weight:800}
  .tile .v{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin-top:8px;color:var(--star)}
  .tile.hi{border-color:var(--line);background:rgba(233,196,106,.07)}
  .tile.hi .v{color:var(--gold-bright)}
  .tile .live{font-size:11px;color:var(--good);font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:6px}
  .tile .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
  .mock-note{color:var(--mist-dim);font-size:12px;text-align:center;margin-top:12px;font-style:italic}

  .bens{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
  .ben{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line-soft);border-radius:16px;padding:20px}
  .ben .g{color:var(--gold-bright);font-size:20px}
  .ben h3{font-size:17px;margin-top:10px;font-weight:600}
  .ben p{color:var(--mist);font-size:14px;margin:6px 0 0}

  .who{text-align:center;padding:56px 24px}
  .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px;color:var(--star);background:rgba(255,255,255,.02)}
  .who .kicker{color:var(--gold-bright);font-family:'Fraunces',serif;font-style:italic;font-size:clamp(20px,3.4vw,28px);max-width:44ch;margin:30px auto 0;font-weight:500}

  .final{text-align:center;padding:72px 24px 40px;background:radial-gradient(600px 300px at 50% 0%, rgba(233,196,106,.12), transparent 70%)}
  .final h2{font-size:clamp(30px,5vw,48px);font-weight:600}
  .final h2 em{font-style:italic;color:var(--gold-bright)}
  .final p{color:var(--mist);font-size:17px;margin:16px auto 0;max-width:50ch}
  .final .sub{font-size:14px;color:var(--mist-dim);margin-top:14px}

  footer{text-align:center;padding:40px 24px 56px;border-top:1px solid var(--line-soft);margin-top:40px}
  footer .fl{display:inline-flex;align-items:center;gap:10px;color:var(--star);font-family:'Fraunces',serif;font-size:18px}
  footer img{width:34px;height:34px;border-radius:9px}
  footer a{color:var(--gold);text-decoration:none}
  footer .small{color:var(--mist-dim);font-size:13px;margin-top:10px}

  @media (max-width:760px){
    .feat,.steps,.bens{grid-template-columns:1fr}
    .tiles{grid-template-columns:repeat(2,1fr)}
    .block{padding:44px 0}
    .lang{top:10px;right:10px}
  }
</style>
</head>
<body>

<span class="twinkle a"></span><span class="twinkle b"></span><span class="twinkle c"></span><span class="twinkle d"></span>

<section class="wrap">

      <div class="tile hi"><div class="k" data-k="tk4"></div><div class="v">R$ ··</div></div>
    </div>
    <div class="mock-note" data-k="mock_note"></div>
  </div>
</section>

<section class="block wrap">
  <div class="head">
    <div class="eyebrow" data-k="s4_eyebrow"></div>
    <h2 data-k="s4_title"></h2>
  </div>
  <div class="bens">
    <div class="ben"><div class="g">🎁</div><h3 data-k="b1_t"></h3><p data-k="b1_d"></p></div>
    <div class="ben"><div class="g">⚡</div><h3 data-k="b2_t"></h3><p data-k="b2_d"></p></div>
    <div class="ben"><div class="g">🎯</div><h3 data-k="b3_t"></h3><p data-k="b3_d"></p></div>
    <div class="ben"><div class="g">🛡️</div><h3 data-k="b4_t"></h3><p data-k="b4_d"></p></div>
    <div class="ben"><div class="g">🖼️</div><h3 data-k="b5_t"></h3><p data-k="b5_d"></p></div>
    <div class="ben"><div class="g">🤝</div><h3 data-k="b6_t"></h3><p data-k="b6_d"></p></div>
  </div>
</section>

<section class="who wrap">
  <div class="eyebrow" data-k="who_eyebrow"></div>
  <div class="chips">
    <span class="chip" data-k="c1"></span><span class="chip" data-k="c2"></span><span class="chip" data-k="c3"></span>
    <span class="chip" data-k="c4"></span><span class="chip" data-k="c5"></span><span class="chip" data-k="c6"></span>
  </div>
  <p class="kicker" data-k="who_kicker"></p>
</section>

<section class="final">
  <h2 data-k="final_h2"></h2>
  <p data-k="final_p"></p>
  <div class="cta-row" style="margin-top:28px"><a class="btn btn-gold" id="ctaBottom" href="#"></a></div>
  <div class="sub" data-k="final_sub"></div>
</section>

<footer>
  <span class="fl"><img src="/icon-512.svg" alt=""> Tábula Estelar</span>
  <div class="small"><span data-k="footer_small"></span> · <a href="https://www.tabulaestelar.com.br">tabulaestelar.com.br</a></div>
</footer>

  var HTML_KEYS = {hero_h1:1, hero_lede:1, final_h2:1};
  function apply(lang){
    var t = T[lang] || T.pt;
    document.querySelectorAll("[data-k]").forEach(function(el){
      var k = el.getAttribute("data-k");
      if(k === "try_app"){ el.textContent = t.try_app; return; }
      if(t[k] == null) return;
      if(HTML_KEYS[k]) el.innerHTML = t[k]; else el.textContent = t[k];
    });
    var waHref = "https://wa.me/" + PARTNER_WA + "?text=" + encodeURIComponent(t.wa_text);
    document.getElementById("ctaTop").textContent = t.cta;
    document.getElementById("ctaTop").href = waHref;
    document.getElementById("ctaBottom").textContent = t.cta;
    document.getElementById("ctaBottom").href = waHref;
    var appTxt = {pt:"Oi",es:"Hola",en:"Hi"}[lang] || "Oi";
    document.getElementById("tryApp").href = "https://wa.me/" + APP_WA + "?text=" + encodeURIComponent(appTxt);
    document.documentElement.lang = {pt:"pt-BR",es:"es-ES",en:"en-US"}[lang];
    document.querySelectorAll(".lang button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lang") === lang); });
    try{ localStorage.setItem("tabula_parceria_lang", lang); }catch(e){}
  }
  (function init(){
    var saved = null;
    try{ saved = localStorage.getItem("tabula_parceria_lang"); }catch(e){}
    var nav = (navigator.language || "pt").slice(0,2).toLowerCase();
    var lang = saved || ({pt:"pt",es:"es",en:"en"}[nav] || "pt");
    apply(lang);
    document.querySelectorAll(".lang button").forEach(function(b){
      b.addEventListener("click", function(){ apply(b.getAttribute("data-lang")); });
    });
  })();
