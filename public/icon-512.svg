<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="64"/>
  
  <!-- Glow effect -->
  <circle cx="256" cy="256" r="240" fill="url(#starGlow)" opacity="0.3"/>
  
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFD700" stroke-width="8"/>
  
  <!-- Middle circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFD700" stroke-width="4" opacity="0.8"/>
  
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  
  <!-- Star points -->
  <g stroke="#FFD700" stroke-width="8" fill="none">
    <!-- Cardinal points -->
    <line x1="256" y1="36" x2="256" y2="76"/>
    <line x1="256" y1="436" x2="256" y2="476"/>
    <line x1="36" y1="256" x2="76" y2="256"/>
    <line x1="476" y1="256" x2="436" y2="256"/>
    
    <!-- Diagonal points -->
    <line x1="76" y1="76" x2="116" y2="116"/>
    <line x1="436" y1="436" x2="476" y2="476"/>
    <line x1="76" y1="436" x2="116" y2="396"/>
    <line x1="436" y1="76" x2="476" y2="36"/>
  </g>
  
  <!-- Secondary star points -->
  <g stroke="#FFD700" stroke-width="4" opacity="0.7">
    <line x1="256" y1="96" x2="256" y2="136"/>
    <line x1="256" y1="376" x2="256" y2="416"/>
    <line x1="96" y1="256" x2="136" y2="256"/>
    <line x1="416" y1="256" x2="376" y2="256"/>
  </g>
  
  <!-- Center star -->
  <g fill="#FFD700">
    <circle cx="256" cy="256" r="20"/>
    <circle cx="256" cy="256" r="12" fill="#000000"/>
    <circle cx="256" cy="256" r="6" fill="#FFD700"/>
  </g>
  
  <!-- Constellation lines -->
  <g stroke="#FFD700" stroke-width="2" opacity="0.5">
    <line x1="160" y1="160" x2="200" y2="200"/>
    <line x1="352" y1="352" x2="392" y2="392"/>
    <line x1="160" y1="352" x2="200" y2="312"/>
    <line x1="352" y1="160" x2="392" y2="120"/>
    
    <!-- Inner connections -->
    <line x1="200" y1="200" x2="240" y2="240"/>
    <line x1="312" y1="312" x2="272" y2="272"/>
  </g>
  
  <!-- Small stars -->
  <g fill="#FFD700" opacity="0.8">
    <circle cx="120" cy="120" r="3"/>
    <circle cx="392" cy="392" r="3"/>
    <circle cx="120" cy="392" r="3"/>
    <circle cx="392" cy="120" r="3"/>
    <circle cx="180" cy="180" r="2"/>
    <circle cx="332" cy="332" r="2"/>
    <circle cx="180" cy="332" r="2"/>
    <circle cx="332" cy="180" r="2"/>
  </g>
</svg>
