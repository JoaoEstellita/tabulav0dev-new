name: Security Smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

jobs:
  frontend-security-smoke:
    runs-on: ubuntu-latest
    env:
      RC_SMOKE_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # firebase-tools (emulator de test:rules) passou a exigir Java 21+.
      # Só fora de push (o emulador é o step mais lento; poupa minutos de Actions).
      - name: Setup Java
        if: ${{ github.event_name != 'push' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: npm ci

      # ── Núcleo RÁPIDO: roda SEMPRE (inclusive push) — feedback imediato, sem Java ──
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run src/utils/__tests__/

      - name: Marketing tests
        run: npx vitest run scripts/marketing/lib/__tests__/ --pool=forks

      # ── PESADO: só fora de push (PR, semanal, manual) — poupa minutos de Actions ──
      - name: RC smoke
        if: ${{ github.event_name != 'push' && env.RC_SMOKE_KEY != '' }}
        run: npm run smoke:rc
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ env.RC_SMOKE_KEY }}

      - name: Firestore rules tests
        if: ${{ github.event_name != 'push' }}
        run: npm run test:rules

      - name: NPM audit (prod deps, high+)
        if: ${{ github.event_name != 'push' }}
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
