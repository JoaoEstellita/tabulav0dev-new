name: Security Smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

jobs:
  frontend-security-smoke:
    runs-on: ubuntu-latest
    env:
      RC_SMOKE_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # firebase-tools (emulator de test:rules) passou a exigir Java 21+.
      # Sem este step o runner usa um JDK < 21 e o test:rules falha em segundos.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run src/utils/__tests__/

      - name: RC smoke
        if: ${{ env.RC_SMOKE_KEY != '' }}
        run: npm run smoke:rc
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ env.RC_SMOKE_KEY }}

      - name: Firestore rules tests
        run: npm run test:rules

      - name: NPM audit (prod deps, high+)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
