name: Security Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-security-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: RC smoke
        run: npm run smoke:rc

      - name: Firestore rules tests
        run: npm run test:rules
