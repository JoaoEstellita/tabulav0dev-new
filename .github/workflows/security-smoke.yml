name: Security Smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

jobs:
  frontend-security-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run src/utils/__tests__/

      - name: RC smoke
        if: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY != '' }}
        run: npm run smoke:rc
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}

      - name: Firestore rules tests
        run: npm run test:rules

      - name: NPM audit (prod deps, high+)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
