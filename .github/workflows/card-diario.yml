# Gera as peças do céu e envia para o Estúdio.
#
# Existe para tirar o João do meio: antes, publicar exigia ligar o PC e rodar o
# gerador à mão. O runner do GitHub já traz Chrome e Node, e o ffmpeg vem por
# apt — o mesmo script roda aqui sem adaptação.
#
# Pré-requisito: o secret MONITORING_PASSWORD (a senha do painel /monitoramento).
#   Settings > Secrets and variables > Actions > New repository secret

name: Peças do céu

# O que sai, e quando:
#
#   todo dia   uma peça, e o assunto vem em cascata:
#              1. a AGENDA, se o dia tem evento marcado (eclipse, lunação,
#                 ingresso, virada de retrógrado)
#              2. a FILA do banco, na ordem que o João montou no Estúdio
#              3. a cascata automática, se não houver nem agenda nem fila
#
# Em trinta dias, sete têm evento datado e vinte e três vêm da fila. O carrossel
# dos doze ascendentes deixou de ser um step de segunda-feira e virou item do
# banco: sai quando estiver no topo da fila.
#
# O VÍDEO DIÁRIO SAIU DO AUTOMÁTICO. Ele continua inteiro em `gerarVideo.mjs` e
# roda pelo botão (`video: true`), mas usa o template da roda animada, que é o
# que ele viu e recusou. Publicar todo dia uma peça recusada é pior do que não
# publicar. Volta quando o template for refeito na linguagem de foto.
#
# A peça mensal continua rodando só por comando.
#
on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília. O vídeo fica pronto antes de acordar.
    # O agendador do GitHub costuma atrasar em horários cheios; não é relógio.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      data:
        description: "Começar em outra data (AAAA-MM-DD). Vazio = hoje."
        required: false
        default: ""
      # Sem isto, encher a editorial pela primeira vez exigia rodar um comando
      # no PC — o atrito que o Estúdio existe para eliminar. Trinta segundos de
      # runner, sem gastar Chrome nem ffmpeg.
      apenas_calendario:
        description: "Só recalcular as pautas do Estúdio (não gera peça nenhuma)"
        type: boolean
        required: false
        default: false
      # O vídeo saiu do diário mas não do repositório: enquanto o template não
      # for refeito, sai por decisão, não por calendário.
      video:
        description: "Gerar também o vídeo (template antigo, roda animada)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Duas execuções ao mesmo tempo brigariam pelo histórico anti-repetição.
concurrency:
  group: card-diario
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    # treze slides de carrossel a ~2s cada; o vídeo só entra por botão
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # As fontes agora viajam DENTRO do HTML, em `data:` URI (lib/fontes.mjs).
      # Este passo instalava o Palatino livre para imitar o Windows, e era uma
      # aproximação: peça aprovada no PC saía com outro desenho aqui. Sem ele o
      # job também começa uns 20s mais cedo.

      - name: Conferir o Chrome do runner
        if: ${{ github.event.inputs.apenas_calendario != 'true' }}
        run: |
          which google-chrome-stable || which google-chrome || which chromium-browser
          google-chrome-stable --version || google-chrome --version

      # O gerador usa uma dependência só. `npm ci` instalaria o app inteiro por
      # nada e levaria minutos.
      # puppeteer-core, não puppeteer: usa o Chrome do runner e não baixa
      # navegador. Com uma instância só, o quadro do vídeo sai em ~100ms em vez
      # dos 2 a 3 segundos que custa lançar o Chrome por linha de comando.
      - name: Instalar dependências do gerador
        run: npm install astronomy-engine@^2.1.19 puppeteer-core --no-save --no-audit --no-fund --loglevel=error

      # A capa dos carrosséis v4 é gerada pelo Higgsfield (Soul). Recria as
      # credenciais a partir dos secrets; o CLI renova o access token sozinho
      # pelo refresh_token. Sem os secrets, o gerador cai no fundo procedural
      # (a peça sai mesmo assim). O CLI expõe `higgsfield` no PATH do runner.
      - name: Autenticar Higgsfield (capa IA)
        env:
          HF_CREDS: ${{ secrets.HIGGSFIELD_CREDENTIALS }}
          HF_CONFIG: ${{ secrets.HIGGSFIELD_CONFIG }}
        run: |
          if [ -z "$HF_CREDS" ]; then echo "Sem HIGGSFIELD_CREDENTIALS — a capa cai no fundo procedural."; exit 0; fi
          npm install -g @higgsfield/cli --no-audit --no-fund --loglevel=error
          mkdir -p "$HOME/.config/higgsfield"
          printf '%s' "$HF_CREDS" > "$HOME/.config/higgsfield/credentials.json"
          printf '%s' "$HF_CONFIG" > "$HOME/.config/higgsfield/config.json"

      # O ubuntu-latest NÃO traz ffmpeg. A conferência anterior usava
      # `ffmpeg -version | head -1`, e o `head` devolvia 0 mesmo com o comando
      # ausente: o mesmo bug de pipeline que escondeu o resto.
      # Só o vídeo precisa de ffmpeg, e o vídeo virou opcional: instalar sempre
      # é ~40s de runner por dia para nada.
      - name: Instalar ffmpeg
        if: ${{ github.event.inputs.apenas_calendario != 'true' && github.event.inputs.video == 'true' }}
        run: |
          set -o pipefail
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      # A janela de 14 dias sem repetir texto vive num JSON ao lado das imagens.
      # Sem restaurar isso, todo dia começaria do zero e o mesmo trânsito voltaria.
      - name: Restaurar histórico anti-repetição
        if: ${{ github.event.inputs.apenas_calendario != 'true' }}
        uses: actions/cache@v4
        with:
          path: marketing/out/.historico.json
          key: card-historico-${{ github.run_id }}
          restore-keys: |
            card-historico-

      # A pauta que o João marcou no Estúdio decide quais peças saem. Sem pauta,
      # sem rede ou com JSON quebrado, a automação segue como sempre — ela NUNCA
      # pode parar porque uma pauta faltou.
      - name: Ler a pauta do dia
        if: ${{ github.event.inputs.apenas_calendario != 'true' }}
        id: pauta
        env:
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          DATA: ${{ github.event.inputs.data || '' }}
        run: |
          DIA="${DATA:-$(date -u +%F)}"
          # duas linhas: os formatos marcados e o id do assunto escolhido
          LIDO=$(curl -s --max-time 20 \
            -H "Authorization: Bearer $MONITORING_PASSWORD" \
            "https://tabulav0dev-backend.vercel.app/api/marketing-cards" \
            | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                try {
                  const dia = (JSON.parse(s).dias||[]).find(x => x.dia === process.argv[1]);
                  const p = dia && dia.pauta;
                  console.log(p && Array.isArray(p.formatos) ? p.formatos.join(',') : '');
                  console.log(p && p.opcaoId ? p.opcaoId : '');
                } catch { console.log(''); console.log('') }
              })" "$DIA" || printf '\n\n')

          ITENS=$(echo "$LIDO" | sed -n '1p')
          ASSUNTO=$(echo "$LIDO" | sed -n '2p')

          # Os formatos marcados chegam ao gerador: desmarcar "carrossel" no
          # Estúdio tem de significar carrossel nenhum. Vazio = o gerador decide
          # pelo que o evento comporta.
          echo "formatos=$ITENS" >> "$GITHUB_OUTPUT"

          # Sem assunto marcado, o gerador escolhe o de maior peso sozinho — a
          # automação NUNCA para porque uma pauta faltou.
          if [ -z "$ASSUNTO" ]; then
            echo "Sem pauta para $DIA — o assunto do dia é o de maior peso."
          else
            echo "Assunto marcado no Estúdio: $ASSUNTO"
            echo "assunto=$ASSUNTO" >> "$GITHUB_OUTPUT"
          fi

          # O card estático voltou, mas só nos dias que o sustentam: eclipse,
          # lunação e entrada de planeta reconhecível. Card todo dia foi o que
          # encheu o feed de peça que servia para qualquer dia.
          # `comum` é o default explícito: a condição do step do evento é
          # "diferente de comum", e vazio passaria por dia de evento.
          FORCA=$(node scripts/marketing/pautaDoDia.mjs --data="$DIA" | sed -n '3p' || echo 'comum')
          FORCA=${FORCA:-comum}
          echo "O dia é: $FORCA"
          echo "forte=$FORCA" >> "$GITHUB_OUTPUT"



      - name: Gerar o vídeo do dia
        if: ${{ github.event.inputs.apenas_calendario != 'true' && github.event.inputs.video == 'true' }}
        env:
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          DATA: ${{ github.event.inputs.data || '' }}
          ASSUNTO: ${{ steps.pauta.outputs.assunto }}
        run: |
          set -o pipefail

          SAIDA="$GITHUB_WORKSPACE/marketing/out"
          ARGS="--upload --saida=$SAIDA"
          [ -n "$DATA" ] && ARGS="$ARGS --data=$DATA"
          [ -n "$ASSUNTO" ] && ARGS="$ARGS --assunto=$ASSUNTO"
          node scripts/marketing/gerarVideo.mjs $ARGS 2>&1 | tee -a saida.txt

          # o script pode sair 0 sem produzir o arquivo (ffmpeg ausente, por
          # exemplo). Um job verde sem vídeo é o que trouxe a gente até aqui.
          DIA="${DATA:-$(date -u +%F)}"
          if [ ! -s "$SAIDA/$DIA/reel.mp4" ]; then
            echo "::error::reel.mp4 não foi produzido para $DIA"
            ls -la "$SAIDA/$DIA" || true
            exit 1
          fi
          echo "reel.mp4: $(du -h "$SAIDA/$DIA/reel.mp4" | cut -f1)"

      # O carrossel só sai marcado: é a peça mais cara de produzir e a que menos
      # dias comportam. Sem pauta ele não sai — quem decide isto é editorial.

      # A peça do dia, todo dia. `lib/assuntoDoDia.mjs` desce a cascata até
      # achar assunto: evento do céu, lua fora de curso, aspecto de corpo
      # pessoal, planeta no signo e, no fim, um conceito escrito. Nunca sai
      # vazia e nunca repete dentro de catorze dias.
      #
      # Na segunda ela cede a vez ao carrossel: duas peças no mesmo dia
      # disputam a mesma legenda no Estúdio, e uma delas sai sem ser lida.
      - name: Gerar as peças do dia
        if: ${{ github.event.inputs.apenas_calendario != 'true' }}
        env:
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          DATA: ${{ github.event.inputs.data || '' }}
        run: |
          set -o pipefail
          ARGS="--upload --saida=$GITHUB_WORKSPACE/marketing/out"
          [ -n "$DATA" ] && ARGS="$ARGS --data=$DATA"
          # `gerarDia` lê a pauta do Estúdio e chama o gerador uma vez por
          # assunto marcado, cada um no seu slot. Sem pauta, sai uma peça pela
          # cascata. O assunto e os formatos deixam de ser lidos aqui: quem faz
          # isso agora é o próprio script, que também sabe quantos são.
          node scripts/marketing/gerarDia.mjs $ARGS 2>&1 | tee -a saida.txt

      # A leitura dos doze ascendentes saiu daqui e virou item do banco.
      #
      # Rodava toda segunda por calendário, sem passar pela agenda nem pela
      # fila, e fazia a segunda ser o único dia sem peça própria. Agora ela sai
      # quando o João a puser no topo da fila, em qualquer dia. `gerarDia`
      # reconhece o id `semanal` e chama `gerarSemanal.mjs`.

      - name: Publicar as pautas dos próximos dias
        if: always()
        env:
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
        run: node scripts/marketing/calendario.mjs --dias=21 --upload || true

      - name: Resumo do run
        if: always()
        run: |
          {
            echo "## Peças do céu"
            echo ""
            if [ -f saida.txt ]; then
              echo '```'
              grep -vE "^(Chrome|Catálogo|Saída|Upload)" saida.txt || cat saida.txt
              echo '```'
            else
              echo "O gerador não chegou a rodar."
            fi
            echo ""
            echo "Cards em <https://www.tabulaestelar.com.br/estudio>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Se algo sair torto no visual, a imagem fica aqui para inspeção sem
      # precisar reproduzir o ambiente do runner.
      - name: Guardar o vídeo para conferência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            marketing/out/**/*.png
            marketing/out/**/*.mp4
            marketing/out/**/*.txt
          retention-days: 7
          if-no-files-found: warn
