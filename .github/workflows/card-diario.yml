# Gera o card "céu de hoje" e envia para o Estúdio, todo dia.
#
# Existe para tirar o João do meio: antes, publicar exigia ligar o PC e rodar o
# gerador à mão. O runner do GitHub já traz Chrome e Node, então o mesmo script
# roda aqui sem adaptação.
#
# Pré-requisito: o secret MONITORING_PASSWORD (a senha do painel /monitoramento).
#   Settings > Secrets and variables > Actions > New repository secret

name: Card diário

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília. O card fica pronto antes de acordar.
    # O agendador do GitHub costuma atrasar em horários cheios; não é relógio.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias gerar a partir de hoje"
        required: false
        default: "1"
      data:
        description: "Começar em outra data (AAAA-MM-DD). Vazio = hoje."
        required: false
        default: ""
      reel:
        description: "Gerar também o vídeo animado do dia"
        type: boolean
        required: false
        default: true
      # Sem isto, encher a editorial pela primeira vez exigia rodar um comando
      # no PC — o atrito que o Estúdio existe para eliminar. Trinta segundos de
      # runner, sem gastar Chrome nem ffmpeg.
      apenas_calendario:
        description: "Só recalcular as pautas do Estúdio (não gera peça nenhuma)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Duas execuções ao mesmo tempo brigariam pelo histórico anti-repetição.
concurrency:
  group: card-diario
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    # o vídeo domina o tempo: ~360 quadros mais a montagem do MP4
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # As fontes do card são do Windows (Palatino Linotype, Consolas). Sem elas
      # o Chrome cai num serif genérico e o card sai diferente do aprovado.
      # fonts-urw-base35 traz o URW Palladio L / P052, que é o Palatino livre.
      - name: Instalar fontes equivalentes
        if: ${{ github.event.inputs.apenas_calendario != 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-urw-base35 fonts-liberation fonts-dejavu-core
          fc-cache -f
          echo "Palatino disponível:"; fc-match "P052" || true
          echo "Mono disponível:"; fc-match "DejaVu Sans Mono" || true

      - name: Conferir o Chrome do runner
        if: ${{ github.event.inputs.apenas_calendario != 'true' }}
        run: |
          which google-chrome-stable || which google-chrome || which chromium-browser
          google-chrome-stable --version || google-chrome --version

      # O gerador usa uma dependência só. `npm ci` instalaria o app inteiro por
      # nada e levaria minutos.
      # puppeteer-core, não puppeteer: usa o Chrome do runner e não baixa
      # navegador. Com uma instância só, o quadro do vídeo sai em ~100ms em vez
      # dos 2 a 3 segundos que custa lançar o Chrome por linha de comando.
      - name: Instalar dependências do gerador
        run: npm install astronomy-engine@^2.1.19 puppeteer-core --no-save --no-audit --no-fund --loglevel=error

      # O ubuntu-latest NÃO traz ffmpeg. A conferência anterior usava
      # `ffmpeg -version | head -1`, e o `head` devolvia 0 mesmo com o comando
      # ausente: o mesmo bug de pipeline que escondeu o resto.
      - name: Instalar ffmpeg
        if: ${{ github.event.inputs.apenas_calendario != 'true' }}
        run: |
          set -o pipefail
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      # A janela de 14 dias sem repetir texto vive num JSON ao lado das imagens.
      # Sem restaurar isso, todo dia começaria do zero e o mesmo trânsito voltaria.
      - name: Restaurar histórico anti-repetição
        if: ${{ github.event.inputs.apenas_calendario != 'true' }}
        uses: actions/cache@v4
        with:
          path: marketing/out/.historico.json
          key: card-historico-${{ github.run_id }}
          restore-keys: |
            card-historico-

      # A pauta que o João marcou no Estúdio decide quais peças saem. Sem pauta,
      # sem rede ou com JSON quebrado, a automação segue como sempre — ela NUNCA
      # pode parar porque uma pauta faltou.
      - name: Ler a pauta do dia
        if: ${{ github.event.inputs.apenas_calendario != 'true' }}
        id: pauta
        env:
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          DATA: ${{ github.event.inputs.data || '' }}
        run: |
          DIA="${DATA:-$(date -u +%F)}"
          # duas linhas: os formatos marcados e o id do assunto escolhido
          LIDO=$(curl -s --max-time 20 \
            -H "Authorization: Bearer $MONITORING_PASSWORD" \
            "https://tabulav0dev-backend.vercel.app/api/marketing-cards" \
            | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                try {
                  const dia = (JSON.parse(s).dias||[]).find(x => x.dia === process.argv[1]);
                  const p = dia && dia.pauta;
                  console.log(p && Array.isArray(p.formatos) ? p.formatos.join(',') : '');
                  console.log(p && p.opcaoId ? p.opcaoId : '');
                } catch { console.log(''); console.log('') }
              })" "$DIA" || printf '\n\n')

          ITENS=$(echo "$LIDO" | sed -n '1p')
          ASSUNTO=$(echo "$LIDO" | sed -n '2p')

          if [ -z "$ITENS" ]; then
            echo "Sem pauta para $DIA — gerando tudo, como de costume."
            echo "tem=nao" >> "$GITHUB_OUTPUT"
          else
            echo "Pauta de $DIA: $ITENS"
            [ -n "$ASSUNTO" ] && echo "Assunto: $ASSUNTO"
            echo "tem=sim" >> "$GITHUB_OUTPUT"
            echo "itens=$ITENS" >> "$GITHUB_OUTPUT"
            echo "assunto=$ASSUNTO" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar e enviar
        id: gerar
        # com pauta, o card só sai se estiver marcado
        if: ${{ github.event.inputs.apenas_calendario != 'true' && (steps.pauta.outputs.tem != 'sim' || contains(steps.pauta.outputs.itens, 'card')) }}
        env:
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          DIAS: ${{ github.event.inputs.dias || '1' }}
          DATA: ${{ github.event.inputs.data || '' }}
          ASSUNTO: ${{ steps.pauta.outputs.assunto }}
        run: |
          # pipefail é obrigatório aqui: o `tee` no fim do pipeline sempre
          # devolve 0, então sem isto uma falha do node passa VERDE. Foi o que
          # escondeu o gerador de vídeo quebrado por dois runs seguidos.
          set -o pipefail

          if [ -z "$MONITORING_PASSWORD" ]; then
            echo "::error::Falta o secret MONITORING_PASSWORD. Cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi

          # --saida explícito: o script deduz a pasta como "pai do frontend",
          # o que vale no monorepo local mas no runner cai FORA do checkout, e
          # então a conferência e o artifact procuram no lugar errado.
          ARGS="--dias=$DIAS --exigir-upload --saida=$GITHUB_WORKSPACE/marketing/out"
          [ -n "$DATA" ] && ARGS="$ARGS --data=$DATA"
          # o assunto escolhido no Estúdio manda; se ele nao existir mais, o
          # gerador avisa e escolhe sozinho — dia sem peca e pior que peca errada
          [ -n "$ASSUNTO" ] && ARGS="$ARGS --assunto=$ASSUNTO"

          echo "Rodando: node scripts/marketing/gerarCard.mjs $ARGS"
          node scripts/marketing/gerarCard.mjs $ARGS 2>&1 | tee saida.txt

      - name: Gerar o Reel animado
        if: ${{ github.event.inputs.apenas_calendario != 'true' && github.event.inputs.reel != 'false' && (steps.pauta.outputs.tem != 'sim' || contains(steps.pauta.outputs.itens, 'reel')) }}
        env:
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          DATA: ${{ github.event.inputs.data || '' }}
        run: |
          set -o pipefail

          SAIDA="$GITHUB_WORKSPACE/marketing/out"
          ARGS="--upload --saida=$SAIDA"
          [ -n "$DATA" ] && ARGS="$ARGS --data=$DATA"
          node scripts/marketing/gerarVideo.mjs $ARGS 2>&1 | tee -a saida.txt

          # o script pode sair 0 sem produzir o arquivo (ffmpeg ausente, por
          # exemplo). Um job verde sem vídeo é o que trouxe a gente até aqui.
          DIA="${DATA:-$(date -u +%F)}"
          if [ ! -s "$SAIDA/$DIA/reel.mp4" ]; then
            echo "::error::reel.mp4 não foi produzido para $DIA"
            ls -la "$SAIDA/$DIA" || true
            exit 1
          fi
          echo "reel.mp4: $(du -h "$SAIDA/$DIA/reel.mp4" | cut -f1)"

      # O carrossel só sai marcado: é a peça mais cara de produzir e a que menos
      # dias comportam. Sem pauta ele não sai — quem decide isto é editorial.
      - name: Gerar o carrossel
        if: ${{ github.event.inputs.apenas_calendario != 'true' && steps.pauta.outputs.tem == 'sim' && contains(steps.pauta.outputs.itens, 'carrossel') }}
        env:
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          DATA: ${{ github.event.inputs.data || '' }}
        run: |
          set -o pipefail
          ARGS="--saida=$GITHUB_WORKSPACE/marketing/out"
          [ -n "$DATA" ] && ARGS="$ARGS --data=$DATA"
          node scripts/marketing/gerarCarrossel.mjs $ARGS 2>&1 | tee -a saida.txt

      # As sugestões do dia seguinte ficam prontas no Estúdio antes de o João
      # acordar — sem isso a editorial nasceria sempre vazia.
      - name: Publicar as pautas dos próximos dias
        if: always()
        env:
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
        run: node scripts/marketing/calendario.mjs --dias=21 --upload || true

      - name: Resumo do run
        if: always()
        run: |
          {
            echo "## Card diário"
            echo ""
            if [ -f saida.txt ]; then
              echo '```'
              grep -vE "^(Chrome|Catálogo|Saída|Upload)" saida.txt || cat saida.txt
              echo '```'
            else
              echo "O gerador não chegou a rodar."
            fi
            echo ""
            echo "Cards em <https://www.tabulaestelar.com.br/estudio>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Se algo sair torto no visual, a imagem fica aqui para inspeção sem
      # precisar reproduzir o ambiente do runner.
      - name: Guardar os cards para conferência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_number }}
          path: |
            marketing/out/**/*.png
            marketing/out/**/*.mp4
            marketing/out/**/*.txt
          retention-days: 7
          if-no-files-found: warn
